# LAT-10949 -- dispatch-only: hang de control plane (paperclip-paperclip-1) aan directus_directus_net,
# zodat alle agent-runs (die in die container draaien) http://vinomartino-directus-1:8055 kunnen bereiken.
#
# Geautoriseerd: Marijn 2026-09-29 ("akkoord, regel het, je krijgt totale vrijheid"), groeiplan taak 0.4.
# Route volgt lat8794/lat3260: GHA -> VPS SSH. `mode` kiest alleen tussen vaste scripts; er wordt niets
# uit de input in een commando geinterpoleerd.
#
# Kleinste ingreep: één `docker network connect` (live, geen restart). paperclip-bridge-forward deelt de
# netns van paperclip-paperclip-1 en ziet de extra interface vanzelf.
# Rollback: mode=disconnect. Beperking: een `docker compose up -d` die paperclip-paperclip-1 RECREATET
# verliest de koppeling (een gewone restart niet) -- dispatch dan connect opnieuw.
#
# LET OP bij het pushen: elk bestand onder .github/ op main triggert normaal een productie-release;
# push met "[skip ci]".

name: LAT-10949 directus net for control plane

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'diagnose = alleen lezen; connect = koppel aan directus_directus_net; disconnect = rollback'
        required: true
        default: diagnose
        type: choice
        options:
          - diagnose
          - connect
          - disconnect

concurrency:
  group: lat10949-directus-net
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          cat >> ~/.ssh/config <<EOF
          Host $VPS_HOST
            StrictHostKeyChecking accept-new
            UserKnownHostsFile ~/.ssh/known_hosts
          EOF
          cat "$GITHUB_WORKSPACE/ops/ssh-config-snippet" >> ~/.ssh/config
          ssh-keyscan "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Diagnose (read-only)
        if: inputs.mode == 'diagnose'
        env:
          VPS: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          SCRIPT: |
            set -uo pipefail
            echo "=== netwerken met 'directus' in de naam ==="
            docker network ls --filter name=directus --format '{{.Name}} {{.Driver}} {{.ID}}' 2>&1
            echo "=== subnet + containers op directus_directus_net ==="
            docker network inspect directus_directus_net \
              --format 'subnet={{range .IPAM.Config}}{{.Subnet}} {{end}} containers={{range .Containers}}{{.Name}} {{end}}' 2>&1
            echo "=== paperclip-paperclip-1: netwerken + subnetten ==="
            for n in $(docker inspect -f '{{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{end}}' paperclip-paperclip-1 2>&1); do
              echo "$n: $(docker network inspect "$n" --format '{{range .IPAM.Config}}{{.Subnet}} {{end}}' 2>&1)"
            done
            echo "=== paperclip-bridge-forward netwerkmodus (verwacht container:<id van paperclip-paperclip-1>) ==="
            docker inspect -f '{{.HostConfig.NetworkMode}}' paperclip-bridge-forward 2>&1
            echo "=== restart policy + uptime ==="
            docker inspect -f 'policy={{.HostConfig.RestartPolicy.Name}} started={{.State.StartedAt}} status={{.State.Status}}' paperclip-paperclip-1 2>&1
            echo "=== DNS + health vanuit paperclip-paperclip-1 (nu) ==="
            docker exec paperclip-paperclip-1 sh -c 'getent hosts vinomartino-directus-1 || echo "GEEN DNS"; curl -s -m 5 -o /dev/null -w "directus /server/health http=%{http_code}\n" http://vinomartino-directus-1:8055/server/health' 2>&1
        run: |
          printf '%s\n' "$SCRIPT" | ssh "$VPS" "bash -s"

      - name: Connect
        if: inputs.mode == 'connect'
        env:
          VPS: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          SCRIPT: |
            set -uo pipefail
            C=paperclip-paperclip-1
            N=directus_directus_net

            echo "=== guard: bestaat het netwerk en draait de container ==="
            docker network inspect "$N" >/dev/null 2>&1 || { echo "::error::netwerk $N bestaat niet"; exit 1; }
            [ "$(docker inspect -f '{{.State.Status}}' $C 2>&1)" = "running" ] || { echo "::error::$C draait niet"; exit 1; }

            echo "=== guard: subnet-overlap met bestaande netwerken van $C ==="
            NEW=$(docker network inspect "$N" --format '{{range .IPAM.Config}}{{.Subnet}} {{end}}')
            OLD=""
            for n in $(docker inspect -f '{{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{end}}' $C); do
              OLD="$OLD $(docker network inspect "$n" --format '{{range .IPAM.Config}}{{.Subnet}} {{end}}')"
            done
            echo "nieuw: $NEW | bestaand: $OLD"
            python3 - "$NEW" "$OLD" <<'PY' || { echo "::error::subnet-overlap, afgebroken zonder iets aan te raken"; exit 1; }
            import sys, ipaddress
            new = [ipaddress.ip_network(s) for s in sys.argv[1].split() if ":" not in s]
            old = [ipaddress.ip_network(s) for s in sys.argv[2].split() if ":" not in s]
            bad = [(a, b) for a in new for b in old if a.overlaps(b)]
            print("overlap:", bad)
            sys.exit(1 if bad else 0)
            PY

            echo "=== voor: default route in $C ==="
            docker exec $C sh -c 'ip route 2>/dev/null | grep default || cat /proc/net/route | head -3'

            echo "=== docker network connect ==="
            if docker inspect -f '{{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{end}}' $C | grep -qw "$N"; then
              echo "al gekoppeld, niets te doen"
            else
              docker network connect "$N" $C || { echo "::error::connect faalde"; exit 1; }
            fi

            sleep 2
            echo "=== na: default route in $C (moet ongewijzigd zijn) ==="
            docker exec $C sh -c 'ip route 2>/dev/null | grep default || cat /proc/net/route | head -3'

            echo "=== control plane gezond? (localhost:3100) + internet-egress ==="
            H=$(docker exec $C sh -c 'curl -s -m 8 -o /dev/null -w "%{http_code}" http://localhost:3100/api/health' 2>&1)
            E=$(docker exec $C sh -c 'curl -s -m 8 -o /dev/null -w "%{http_code}" https://api.github.com/zen' 2>&1)
            echo "health=$H egress=$E"
            if [ "$H" != "200" ]; then
              echo "::error::control plane ongezond na connect, automatische rollback"
              docker network disconnect "$N" $C
              exit 1
            fi

            echo "=== DNS + Directus-health vanuit $C ==="
            docker exec $C sh -c 'getent hosts vinomartino-directus-1 || echo "GEEN DNS"; curl -s -m 5 -o /dev/null -w "directus /server/health http=%{http_code}\n" http://vinomartino-directus-1:8055/server/health'

            echo "=== bridge-forward deelt netns; status ==="
            docker inspect -f 'status={{.State.Status}}' paperclip-bridge-forward
        run: |
          printf '%s\n' "$SCRIPT" | ssh "$VPS" "bash -s"

      - name: Disconnect (rollback)
        if: inputs.mode == 'disconnect'
        env:
          VPS: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          SCRIPT: |
            set -uo pipefail
            C=paperclip-paperclip-1
            N=directus_directus_net
            if docker inspect -f '{{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{end}}' $C | grep -qw "$N"; then
              docker network disconnect "$N" $C && echo "losgekoppeld"
            else
              echo "was niet gekoppeld, niets te doen"
            fi
            docker exec $C sh -c 'curl -s -m 8 -o /dev/null -w "health=%{http_code}\n" http://localhost:3100/api/health'
        run: |
          printf '%s\n' "$SCRIPT" | ssh "$VPS" "bash -s"
