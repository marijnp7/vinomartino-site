# LAT-6686 — verwijder vier laag-risico paden uit het ro-gemounte anonieme volume
# 6e70e905369b205ceebde64c2bc96dd8a204ddd7d10f43ecd7b36c659062ead1. Goedgekeurd via
# board-approval 1cdb3045-c3cb-4f41-84b2-a4c4988c7c4c (2026-08-21). Zelfde SSH-kanaal/patroon
# als lat6326-disk-cleanup.yml en lat3214-docker-log-rotation.yml — host-shell buiten de
# scoped docker-broker om, geen container-recreate nodig.
#
# Drie modes, oplopend risico. Paden zijn NIET input-gestuurd (vast in het script), om
# scope-creep naar willekeurige verwijdering onmogelijk te maken:
#   measure — alleen lezen: bestaan de vier paden nog, du -sh per pad, df.
#   apply   — mount het volume rw in een wegwerpcontainer en verwijdert UITSLUITEND:
#               site/, site-wt-lat2436/, .local/node_modules/, .npm-global/lib/node_modules/
#             Geen ander pad, geen named volume, geen draaiende container aangeraakt.
#   verify  — alleen lezen: bevestigt dat de vier paden weg zijn, df erna.

name: LAT-6686 volume cleanup

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'measure = alleen meten; apply = de vier paden verwijderen; verify = alleen aflezen'
        required: true
        default: measure
        type: choice
        options:
          - measure
          - apply
          - verify

concurrency:
  group: lat6686-volume-cleanup
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          cat >> ~/.ssh/config <<EOF
          Host $VPS_HOST
            StrictHostKeyChecking accept-new
            UserKnownHostsFile ~/.ssh/known_hosts
          EOF
          cat "$GITHUB_WORKSPACE/ops/ssh-config-snippet" >> ~/.ssh/config
          ssh-keyscan "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      # ---------------------------------------------------------------- measure
      - name: Measure (read-only)
        if: inputs.mode == 'measure'
        env:
          VPS: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          MEASURE: |
            set -uo pipefail
            VOL=6e70e905369b205ceebde64c2bc96dd8a204ddd7d10f43ecd7b36c659062ead1
            echo "=== df ==="
            df -h /
            echo
            echo "=== per-pad bestaan + grootte (ro mount) ==="
            docker run --rm -v "$VOL":/dst:ro alpine sh -c '
              for p in site site-wt-lat2436 .local/node_modules .npm-global/lib/node_modules; do
                if [ -e "/dst/$p" ]; then
                  echo "EXISTS $p  $(du -sh "/dst/$p" 2>/dev/null | cut -f1)"
                else
                  echo "ABSENT $p"
                fi
              done
            '
        run: |
          printf '%s\n' "$MEASURE" | ssh "$VPS" "bash -s"

      # ---------------------------------------------------------------- apply
      - name: Apply cleanup (only the four named paths, rw mount)
        if: inputs.mode == 'apply'
        env:
          VPS: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          APPLY: |
            set -uo pipefail
            VOL=6e70e905369b205ceebde64c2bc96dd8a204ddd7d10f43ecd7b36c659062ead1
            echo "=== df BEFORE ==="
            df -h /
            echo

            echo "=== verwijderen (rw mount, uitsluitend deze vier paden) ==="
            docker run --rm -v "$VOL":/dst alpine sh -c '
              for p in site site-wt-lat2436 .local/node_modules .npm-global/lib/node_modules; do
                if [ -e "/dst/$p" ]; then
                  sz=$(du -sh "/dst/$p" 2>/dev/null | cut -f1)
                  rm -rf -- "/dst/$p"
                  echo "removed $p (was $sz)"
                else
                  echo "SKIP $p (bestaat niet)"
                fi
              done
            '
            echo

            echo "=== df AFTER ==="
            df -h /
        run: |
          printf '%s\n' "$APPLY" | ssh "$VPS" "bash -s"

      # ---------------------------------------------------------------- verify
      - name: Verify (read-only)
        if: inputs.mode == 'verify'
        env:
          VPS: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          VERIFY: |
            set -uo pipefail
            VOL=6e70e905369b205ceebde64c2bc96dd8a204ddd7d10f43ecd7b36c659062ead1
            echo "=== df ==="
            df -h /
            echo
            echo "=== per-pad bestaan (moet ABSENT zijn) ==="
            docker run --rm -v "$VOL":/dst:ro alpine sh -c '
              for p in site site-wt-lat2436 .local/node_modules .npm-global/lib/node_modules; do
                if [ -e "/dst/$p" ]; then
                  echo "STILL EXISTS $p  $(du -sh "/dst/$p" 2>/dev/null | cut -f1)"
                else
                  echo "ABSENT $p"
                fi
              done
            '
        run: |
          printf '%s\n' "$VERIFY" | ssh "$VPS" "bash -s"
