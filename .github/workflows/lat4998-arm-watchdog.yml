# Control the LAT-3204 / LAT-3222 devops-proxy watchdog on the VPS host (LAT-4998).
#
# workflow_dispatch-only, no push trigger. Reuses the exact SSH channel already
# in production in deploy-cos.yml (webfactory/ssh-agent + VPS_SSH_PRIVATE_KEY) —
# adds no new secret and no new reach: dispatch rights on this repo are already
# repo-write-equivalent, and repo write already reaches this host via push to main.
#
# arm.sh has no dry-run mode of its own (confirmed by reading it on-host,
# LAT-4998): it always installs the cron once calibration goes green. The real
# dry run is calling devops-proxy-watchdog.sh directly with WATCHDOG_DRY_RUN=1,
# which only suppresses a restart action, never touches /etc/cron.d.
#
# Order of operations (see LAT-4998 comment thread): probe -> unpause (liveness
# proof while the target is NOT paused, zero mutation) -> arm -> only then the
# real docker-pause trigger test. unpause ships in this same file so the
# rollback path for that test does not depend on the broker it is testing.
#
# Vereiste secrets: VPS_HOST, VPS_USER, VPS_SSH_PRIVATE_KEY (same as deploy-cos.yml)

name: LAT-3204 Watchdog Control

on:
  # LAT-5004 — the watchdog's own silence needs an observer, and that observer
  # must sit OUTSIDE the blast radius it watches. A checker on the VPS would die
  # with the same host outage it is meant to report (the failure mode that cost
  # 33.6h unreported once already). GitHub's scheduler is off-host by
  # construction and adds no moving part to the VPS, so the regress
  # ("who watches the watcher's watcher?") terminates at a third party whose
  # liveness we do not maintain.
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'probe = dry-run calibration only, installs nothing. arm = install the cron (run only after a probe shows green). unpause = docker unpause paperclip-devops-proxy-1 (liveness check / rollback). pause = the real trigger test, docker pause paperclip-devops-proxy-1 (run only after arm + a proven unpause liveness check). status = read-only container state + watchdog.log tail (no mutation; use this to poll recovery after pause, since dws_exec.sh depends on the broker being tested).'
        required: true
        type: choice
        default: probe
        options:
          - probe
          - arm
          - unpause
          - pause
          - status
          - verify

permissions:
  contents: read

concurrency:
  group: lat3204-watchdog
  cancel-in-progress: false

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          cat >> ~/.ssh/config <<EOF
          Host $VPS_HOST
            StrictHostKeyChecking accept-new
            UserKnownHostsFile ~/.ssh/known_hosts
          EOF
          cat "$GITHUB_WORKSPACE/ops/ssh-config-snippet" >> ~/.ssh/config
          ssh-keyscan "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: probe -- dry-run calibration only, installs nothing
        if: ${{ inputs.mode == 'probe' }}
        env:
          VPS: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          REMOTE_SCRIPT: |
            set -uo pipefail
            WATCHDOG_DRY_RUN=1 /opt/paperclip-cos/lat3204/devops-proxy-watchdog.sh
            echo "EXIT=$?"
            echo "--- watchdog-state.json ---"
            cat /opt/paperclip-cos/lat3204/watchdog-state.json 2>/dev/null || echo "(missing)"
        run: |
          printf '%s\n' "$REMOTE_SCRIPT" | ssh "$VPS" "bash -s"

      - name: unpause -- liveness proof / rollback, zero mutation when not paused
        if: ${{ inputs.mode == 'unpause' }}
        env:
          VPS: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          REMOTE_SCRIPT: |
            set -uo pipefail
            docker unpause paperclip-devops-proxy-1
            echo "EXIT=$?"
            docker inspect -f '{{.State.Status}}' paperclip-devops-proxy-1
        run: |
          printf '%s\n' "$REMOTE_SCRIPT" | ssh "$VPS" "bash -s"

      - name: pause -- the real trigger test (docker pause paperclip-devops-proxy-1)
        if: ${{ inputs.mode == 'pause' }}
        env:
          VPS: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          REMOTE_SCRIPT: |
            set -uo pipefail
            docker pause paperclip-devops-proxy-1
            echo "EXIT=$?"
            docker inspect -f '{{.State.Status}}' paperclip-devops-proxy-1
        run: |
          printf '%s\n' "$REMOTE_SCRIPT" | ssh "$VPS" "bash -s"

      - name: status -- read-only container state + watchdog.log tail, no mutation
        if: ${{ inputs.mode == 'status' }}
        env:
          VPS: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          REMOTE_SCRIPT: |
            set -uo pipefail
            echo "--- container state ---"
            docker inspect -f '{{.State.Status}}' paperclip-devops-proxy-1
            echo "--- watchdog.log tail ---"
            tail -n 20 /opt/paperclip-cos/lat3204/watchdog.log 2>/dev/null || echo "(missing)"
            echo "--- watchdog-state.json ---"
            cat /opt/paperclip-cos/lat3204/watchdog-state.json 2>/dev/null || echo "(missing)"
        run: |
          printf '%s\n' "$REMOTE_SCRIPT" | ssh "$VPS" "bash -s"

      - name: arm -- installs the cron, only after a probe has shown green
        if: ${{ inputs.mode == 'arm' }}
        env:
          VPS: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          REMOTE_SCRIPT: |
            set -uo pipefail
            /opt/paperclip-cos/lat3204/arm.sh
            echo "EXIT=$?"
            echo "--- watchdog-state.json ---"
            cat /opt/paperclip-cos/lat3204/watchdog-state.json 2>/dev/null || echo "(missing)"
            echo "--- cron entry ---"
            cat /etc/cron.d/paperclip-devops-proxy-watchdog 2>/dev/null || echo "(not installed)"
        run: |
          printf '%s\n' "$REMOTE_SCRIPT" | ssh "$VPS" "bash -s"

      # LAT-5004 — independent second-observer confirmation (read-only, zero mutation).
      # Unlike `status`, this asserts rather than prints: the step EXITS NON-ZERO if the
      # cron is missing/wrong or the log has not ticked recently, so the GHA run
      # conclusion itself is the verdict and cannot be read as green by mistake.
      - name: verify -- assert cron armed + log still ticking (read-only)
        id: verify
        # On a `schedule` event the workflow_dispatch `inputs` context is NOT
        # populated and the input default is NOT applied, so `inputs.mode` is ''.
        # Without the event_name arm every step would skip and the run would go
        # GREEN having checked nothing — the exact false-green this alarm exists
        # to prevent. The `guard` step below is the backstop for that.
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'verify' }}
        env:
          VPS: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          REMOTE_SCRIPT: |
            set -uo pipefail
            CRON=/etc/cron.d/paperclip-devops-proxy-watchdog
            LOG=/opt/paperclip-cos/lat3204/watchdog.log
            SH=/opt/paperclip-cos/lat3204/devops-proxy-watchdog.sh
            rc=0
            echo "--- host clock (UTC) ---"; date -u +%FT%TZ
            echo "--- cron entry ---"
            if [ -f "$CRON" ]; then
              cat "$CRON"
              grep -q '\*/2 \* \* \* \*' "$CRON" || { echo "ASSERT_FAIL: cron is not */2"; rc=1; }
              grep -qF "$SH" "$CRON" || { echo "ASSERT_FAIL: cron does not point at $SH"; rc=1; }
            else
              echo "ASSERT_FAIL: $CRON missing"; rc=1
            fi
            echo "--- watchdog script ---"
            ls -l "$SH" 2>/dev/null || { echo "ASSERT_FAIL: $SH missing"; rc=1; }
            echo "--- cron daemon ---"
            systemctl is-active cron 2>/dev/null || systemctl is-active crond 2>/dev/null || echo "(systemctl unavailable)"
            echo "--- container state ---"
            docker inspect -f '{{.State.Status}}' paperclip-devops-proxy-1 || rc=1
            echo "--- watchdog.log tail ---"
            tail -n 8 "$LOG" 2>/dev/null || echo "(missing)"
            echo "--- freshness ---"
            MT=$(stat -c %Y "$LOG" 2>/dev/null || echo 0)
            NOW=$(date -u +%s)
            AGE=$(( NOW - MT ))
            echo "log_mtime_epoch=$MT now_epoch=$NOW log_age_seconds=$AGE"
            # cron is */2, so a healthy log is < 240s old; 300s allows one skewed tick.
            if [ "$MT" -eq 0 ]; then
              echo "ASSERT_FAIL: $LOG unreadable/missing"; rc=1
            elif [ "$AGE" -ge 300 ]; then
              echo "ASSERT_FAIL: log stale, ${AGE}s since last write (threshold 300s)"; rc=1
            else
              echo "OK: log ticked ${AGE}s ago"
            fi
            echo "VERIFY_RC=$rc"
            exit $rc
        # Transport failure and assert failure are NOT the same event and must not
        # share an exit code. Measured 2026-08-11 (LAT-5004): the GHA->VPS SSH leg
        # timed out on 2 of 10 runs (~104s TCP connect timeout, ssh exit 255).
        # A schedule that alarmed on those would false-red ~20% of the time and be
        # trained out within a week. ssh returns the REMOTE exit code (1 = a real
        # ASSERT_FAIL) and reserves 255 for its own transport errors, so we retry
        # only 255 and never retry a genuine 1.
        run: |
          set -uo pipefail
          # LAT-3407 / gemeten 2026-08-14: tijdens een rode run bereikte GEEN
          # enkele runner-verbinding sshd -- het journal toont nul connects vanaf
          # runner-IPs in het faalvenster, terwijl dezelfde Azure-IPs 9 min later
          # wel gewoon binnenkomen. UFW/nftables staan open en tellen door. De
          # blokkade zit dus upstream bij de hoster en is voorbijgaand.
          #
          # De oude lus was 3 pogingen, maar ops/ssh-config-snippet zet
          # ConnectionAttempts 5 x ConnectTimeout 20 = ~100s per poging. Drie
          # pogingen dekten daarmee ~4,5 min aaneengesloten. Dat bleek te kort.
          # Hier overrulen we die twee opties bewust (1 connect, 15s) zodat een
          # poging kort is, en spreiden we in plaats daarvan de LUS: 6 pogingen
          # met oplopende backoff over ~8 min. Zelfde totale geduld, maar
          # verdeeld over meer momenten in de tijd -- en dat is wat helpt bij een
          # blokkade die komt en gaat, niet langer doorbijten op een dood moment.
          #
          # Blijft binnen de */15-cadans, dus een echt platte VPS gaat nog steeds
          # binnen een tick luid rood. Alleen de flapper wordt weggefilterd.
          attempt=0
          max_attempts=6
          while : ; do
            attempt=$(( attempt + 1 ))
            set +e
            printf '%s\n' "$REMOTE_SCRIPT" | ssh \
              -o ConnectTimeout=15 \
              -o ConnectionAttempts=1 \
              "$VPS" "bash -s"
            rc=$?
            set -e
            if [ "$rc" -ne 255 ]; then
              exit "$rc"          # 0 = armed and ticking, 1 = real ASSERT_FAIL
            fi
            echo "::warning::attempt ${attempt}/${max_attempts}: ssh transport failure (exit 255), not a watchdog verdict"
            if [ "$attempt" -ge "$max_attempts" ]; then break; fi
            sleep $(( 20 + attempt * 20 ))
          done
          echo "TRANSPORT_FAIL: could not reach the VPS over SSH in ${max_attempts} attempts over ~8 min"
          exit 2                  # distinct from an assert failure on purpose

      # Backstop for the false-green above: if the scheduled run somehow skipped
      # the verify step, the job would otherwise report success having asserted
      # nothing. This step makes that state loud.
      - name: guard -- a scheduled run must actually have verified
        if: ${{ always() && github.event_name == 'schedule' }}
        run: |
          echo "verify step outcome: ${{ steps.verify.outcome }}"
          if [ "${{ steps.verify.outcome }}" != "success" ]; then
            echo "GUARD_FAIL: scheduled verify did not run and pass (outcome=${{ steps.verify.outcome }})"
            exit 1
          fi
