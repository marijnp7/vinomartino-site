name: LAT-2735 C3 — Measure cellar contrast baseline

on:
  workflow_dispatch:
    inputs:
      production_url:
        description: 'Production URL to measure (default: https://vinomartino.com)'
        required: false
        default: 'https://vinomartino.com'
        type: string

jobs:
  measure-contrast:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --save-dev playwright

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Create scripts directory
        run: mkdir -p scripts

      - name: Copy measurement script
        run: |
          cat > scripts/lat2735-cellar-contrast-baseline.mjs << 'SCRIPT_EOF'
          import { chromium } from 'playwright';
          import { writeFileSync, mkdirSync } from 'fs';
          import { join } from 'path';

          // WCAG contrast ratio calculation
          function getLuminance(r, g, b) {
            const [rs, gs, bs] = [r, g, b].map(x => {
              x = x / 255;
              return x <= 0.03928 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4);
            });
            return 0.2126 * rs + 0.7152 * gs + 0.0722 * bs;
          }

          function getContrastRatio(fg, bg) {
            const l1 = getLuminance(fg.r, fg.g, fg.b);
            const l2 = getLuminance(bg.r, bg.g, bg.b);
            const lighter = Math.max(l1, l2);
            const darker = Math.min(l1, l2);
            return (lighter + 0.05) / (darker + 0.05);
          }

          function rgbToObject(rgbString) {
            // Accepts rgb() and rgba() in both legacy-comma and space/slash syntax.
            const match = String(rgbString).match(
              /rgba?\(\s*([\d.]+)[\s,]+([\d.]+)[\s,]+([\d.]+)(?:\s*[,/]\s*([\d.]+))?\s*\)/
            );
            if (!match) return null;
            return {
              r: Math.round(parseFloat(match[1])),
              g: Math.round(parseFloat(match[2])),
              b: Math.round(parseFloat(match[3])),
              a: match[4] === undefined ? 1 : parseFloat(match[4])
            };
          }

          function isFontSizeLarge(fontSize) {
            const px = parseInt(fontSize);
            return px >= 24 || (px >= 18.66 && fontSize.includes('bold'));
          }

          function getThresholdForElement(element) {
            const fontWeight = element.fontWeight;
            const fontSize = element.fontSize;
            const isBold = fontWeight >= 700;
            const pxSize = parseInt(fontSize);

            if (pxSize >= 24 || (pxSize >= 18.66 && isBold)) {
              return { threshold: 3, category: 'large' };
            }
            return { threshold: 4.5, category: 'normal' };
          }

          async function measureContrast(page) {
            const results = [];
            const errors = [];

            // Find all text elements in #atlas
            const elements = await page.locator('#atlas *').all();

            for (const element of elements) {
              try {
                const text = await element.textContent();
                const isVisible = await element.isVisible();

                if (!text || !text.trim() || !isVisible) continue;

                // Get computed styles
                const styles = await element.evaluate(el => {
                  // Most elements compute to backgroundColor rgba(0,0,0,0). Taking that
                  // literally skips nearly every node and yields a false "0 failures", so
                  // resolve the *effective* background by compositing the ancestor chain.
                  function parseColor(c) {
                    const m = String(c).match(
                      /rgba?\(\s*([\d.]+)[\s,]+([\d.]+)[\s,]+([\d.]+)(?:\s*[,/]\s*([\d.]+))?\s*\)/
                    );
                    if (!m) return null;
                    return {
                      r: parseFloat(m[1]), g: parseFloat(m[2]), b: parseFloat(m[3]),
                      a: m[4] === undefined ? 1 : parseFloat(m[4])
                    };
                  }

                  function composite(top, bottom) {
                    const a = top.a;
                    return {
                      r: Math.round(top.r * a + bottom.r * (1 - a)),
                      g: Math.round(top.g * a + bottom.g * (1 - a)),
                      b: Math.round(top.b * a + bottom.b * (1 - a)),
                      a: 1
                    };
                  }

                  // Collect painted layers from this element upwards, stopping at the
                  // first fully opaque one.
                  const layers = [];
                  let node = el;
                  let opaqueFound = false;
                  let ownBg = null;
                  while (node) {
                    const c = parseColor(window.getComputedStyle(node).backgroundColor);
                    if (node === el) ownBg = window.getComputedStyle(node).backgroundColor;
                    if (c && c.a > 0) {
                      layers.push(c);
                      if (c.a >= 1) { opaqueFound = true; break; }
                    }
                    node = node.parentElement;
                  }

                  // Canvas beneath everything: the UA/base canvas. Only reached when no
                  // opaque ancestor exists; recorded so the report can flag the assumption.
                  let effective = { r: 255, g: 255, b: 255, a: 1 };
                  for (let i = layers.length - 1; i >= 0; i--) {
                    effective = composite(layers[i], effective);
                  }

                  const computed = window.getComputedStyle(el);
                  const fgRaw = parseColor(computed.color);
                  // A translucent text colour paints over the effective background too.
                  const fg = fgRaw && fgRaw.a < 1 ? composite(fgRaw, effective) : fgRaw;

                  return {
                    text: el.textContent.substring(0, 50),
                    color: fg ? `rgb(${fg.r}, ${fg.g}, ${fg.b})` : computed.color,
                    colorRaw: computed.color,
                    backgroundColor: `rgb(${effective.r}, ${effective.g}, ${effective.b})`,
                    backgroundOwn: ownBg,
                    backgroundInherited: !(layers.length && layers[0].a >= 1 && node === el),
                    backgroundAssumedCanvas: !opaqueFound,
                    fontSize: computed.fontSize,
                    fontWeight: computed.fontWeight,
                    tagName: el.tagName,
                    className: typeof el.className === 'string' ? el.className : ''
                  };
                });

                // Parse colors
                const fgColor = rgbToObject(styles.color);
                const bgColor = rgbToObject(styles.backgroundColor);

                if (!fgColor || !bgColor) continue;

                // Calculate contrast
                const ratio = getContrastRatio(fgColor, bgColor);
                const { threshold, category } = getThresholdForElement({
                  fontSize: styles.fontSize,
                  fontWeight: parseInt(styles.fontWeight)
                });

                const passes = ratio >= threshold;

                results.push({
                  element: `${styles.tagName}.${styles.className}`,
                  text: styles.text,
                  foreground: styles.color,
                  background: styles.backgroundColor,
                  ratio: parseFloat(ratio.toFixed(2)),
                  threshold,
                  category,
                  passes,
                  fontsize: styles.fontSize,
                  backgroundInherited: styles.backgroundInherited,
                  backgroundAssumedCanvas: styles.backgroundAssumedCanvas
                });
              } catch (e) {
                // Skip elements we can't measure
              }
            }

            return results;
          }

          async function canaryTest() {
            // Test known color pairs
            const tests = [
              { fg: { r: 118, g: 118, b: 118 }, bg: { r: 255, g: 255, b: 255 }, expected: 4.54, tolerance: 0.1 },
              { fg: { r: 136, g: 136, b: 136 }, bg: { r: 255, g: 255, b: 255 }, expected: 3.54, tolerance: 0.1 }
            ];

            const canaryResults = [];
            for (const test of tests) {
              const ratio = getContrastRatio(test.fg, test.bg);
              const pass = Math.abs(ratio - test.expected) < test.tolerance;
              canaryResults.push({
                fg: `rgb(${test.fg.r}, ${test.fg.g}, ${test.fg.b})`,
                bg: `rgb(${test.bg.r}, ${test.bg.g}, ${test.bg.b})`,
                ratio: parseFloat(ratio.toFixed(2)),
                expected: test.expected,
                pass
              });
            }

            return canaryResults;
          }

          async function main() {
            const browser = await chromium.launch();
            const context = await browser.newContext();
            const page = await context.newPage();

            // Set viewport to standard desktop size
            await page.setViewportSize({ width: 1280, height: 720 });

            try {
              // Navigate to production homepage
              const url = process.env.PRODUCTION_URL || 'https://vinomartino.com/';
              console.log(`Navigating to ${url}...`);
              await page.goto(url, { waitUntil: 'networkidle' });

              // Verify we're on the page
              const atlasExists = await page.locator('#atlas').count() > 0;
              if (!atlasExists) {
                throw new Error('Atlas section not found on homepage');
              }

              // Enable dark mode by toggling cellar theme
              console.log('Enabling dark mode (cellar theme)...');
              const bgBefore = await page.evaluate(
                () => window.getComputedStyle(document.body).backgroundColor
              );
              await page.evaluate(() => {
                document.documentElement.setAttribute('data-theme', 'cellar');
                localStorage.setItem('theme', 'cellar');
              });

              // Wait for theme to apply
              await page.waitForTimeout(500);

              // Measuring light mode and reporting it as the cellar baseline is the
              // failure mode that looks most like success, so prove the theme landed.
              const bgAfter = await page.evaluate(
                () => window.getComputedStyle(document.body).backgroundColor
              );
              const themeAttr = await page.evaluate(
                () => document.documentElement.getAttribute('data-theme')
              );
              console.log(`body background: ${bgBefore} -> ${bgAfter} (data-theme=${themeAttr})`);
              if (bgBefore === bgAfter) {
                throw new Error(
                  `data-theme="cellar" did not change the rendered background (${bgAfter}). ` +
                  `Either the site ignores the attribute or the theme is applied another way — ` +
                  `refusing to report light-mode numbers as a cellar baseline.`
                );
              }

              // Run canary test first
              console.log('Running canary test...');
              const canary = await canaryTest();
              const canaryPass = canary.every(t => t.pass);

              if (!canaryPass) {
                console.error('CANARY TEST FAILED:');
                console.table(canary);
                process.exit(1);
              }
              console.log('✓ Canary test passed');

              // Measure contrast
              console.log('Measuring contrast in atlas section...');
              const results = await measureContrast(page);

              // "0 measured" and "0 failed" serialise to the same green summary, so make
              // an empty result set an explicit failure instead of a silent pass.
              if (results.length === 0) {
                throw new Error(
                  'Measured 0 text elements under #atlas — selector, page structure or ' +
                  'visibility gating is wrong. This is a broken run, not a passing baseline.'
                );
              }

              // Create output directory
              mkdirSync('artifacts', { recursive: true });

              // Save results to JSON
              const report = {
                timestamp: new Date().toISOString(),
                url: url,
                theme: 'cellar (dark mode)',
                themeProof: { bodyBackgroundBefore: bgBefore, bodyBackgroundAfter: bgAfter, dataTheme: themeAttr },
                canary: canary,
                measurements: results,
                summary: {
                  total: results.length,
                  passed: results.filter(r => r.passes).length,
                  failed: results.filter(r => !r.passes).length
                }
              };

              writeFileSync('artifacts/contrast-report.json', JSON.stringify(report, null, 2));

              // Create markdown report
              let markdown = `# WCAG AA Contrast Measurement Report\n\n`;
              markdown += `**Generated:** ${new Date().toISOString()}\n`;
              markdown += `**URL:** ${report.url}\n`;
              markdown += `**Theme:** ${report.theme}\n`;
              markdown += `**Theme proof:** body background ${bgBefore} → ${bgAfter} (\`data-theme=${themeAttr}\`)\n\n`;

              markdown += `## Canary Test\n\n`;
              markdown += `| FG | BG | Ratio | Expected | Pass |\n`;
              markdown += `|----|----|-------|----------|------|\n`;
              for (const t of canary) {
                markdown += `| ${t.fg} | ${t.bg} | ${t.ratio} | ${t.expected} | ${t.pass ? '✓' : '✗'} |\n`;
              }

              markdown += `\n## Measurements\n\n`;
              markdown += `| Element | Text | FG | BG | Ratio | WCAG AA | Result |\n`;
              markdown += `|---------|------|----|----|-------|---------|--------|\n`;
              for (const r of results) {
                const t = String(r.text).replace(/\s+/g, ' ').trim().substring(0, 40);
                markdown += `| \`${r.element}\` | ${t} | ${r.foreground} | ${r.background} | ${r.ratio} | ${r.threshold}:1 (${r.category}) | ${r.passes ? 'PASS' : 'FAIL'} |\n`;
              }

              markdown += `\n## Summary\n\n`;
              markdown += `- **Total elements:** ${report.summary.total}\n`;
              markdown += `- **Passed:** ${report.summary.passed}\n`;
              markdown += `- **Failed:** ${report.summary.failed}\n\n`;

              const failed = results.filter(r => !r.passes);
              if (failed.length > 0) {
                markdown += `### ⚠️ Failed Elements\n\n`;
                markdown += `| Element | Text | FG | BG | Ratio | Threshold |\n`;
                markdown += `|---------|------|----|----|-------|----------|\n`;
                for (const r of failed) {
                  markdown += `| ${r.element} | ${r.text.substring(0, 30)} | ${r.foreground} | ${r.background} | **${r.ratio}** | ${r.threshold}:1 |\n`;
                }
                markdown += '\n';
              }

              writeFileSync('artifacts/contrast-report.md', markdown);

              // Log summary
              console.log('\n' + markdown);

              // Set job summary for GitHub Actions
              if (process.env.GITHUB_STEP_SUMMARY) {
                writeFileSync(process.env.GITHUB_STEP_SUMMARY, markdown);
              }

              // Exit with appropriate code
              if (failed.length > 0) {
                console.error(`\n❌ ${failed.length} elements failed WCAG AA contrast requirements`);
                process.exit(1);
              } else {
                console.log('\n✅ All elements pass WCAG AA contrast requirements');
                process.exit(0);
              }

            } catch (error) {
              console.error('Error:', error.message);
              process.exit(1);
            } finally {
              await context.close();
              await browser.close();
            }
          }

          main();
          SCRIPT_EOF

      - name: Run contrast measurement
        env:
          PRODUCTION_URL: ${{ inputs.production_url || 'https://vinomartino.com/' }}
        run: node scripts/lat2735-cellar-contrast-baseline.mjs

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contrast-baseline-artifacts
          path: artifacts/
          retention-days: 30

      - name: Create job summary
        if: always()
        run: |
          if [ -f artifacts/contrast-report.md ]; then
            cat artifacts/contrast-report.md >> $GITHUB_STEP_SUMMARY
          fi
