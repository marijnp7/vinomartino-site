# LAT-12798 — schijf 91%: opruimen op de VPS-host via het GHA->VPS SSH-kanaal.
#
# GOEDKEURING: CTO-besluit op LAT-12798 (stap 1-3 hieronder, 2026-10-07). Dit bestand is
# gate-set (workflow-file, R2 punt 1) en gaat dus via Marijn. Route: kaart 933eff00.
#
# Waarom dit kanaal: de scoped broker blokkeert `docker rmi`, `image prune` en `docker run`
# (gemeten 2026-10-07: 403 "scoped broker: forbidden"). Op de host speelt de broker niet mee.
#
# Geen push-trigger. `mode` kiest alleen tussen vaste scripts; er wordt niets uit de input
# in een commando geinterpoleerd.
#
# LET OP bij het pushen/mergen: .github/** staat niet in paths-ignore van deploy.yml. Gebruik
# een merge-subject met "[skip ci]" (zie memory: skip-ci-lost-on-gh-pr-merge).
#
# measure : alleen lezen. docker system df + grootste mappen, om de structurele oorzaak te vinden.
# apply   : UITGESCHAKELD (LAT-13687, 2026-10-16). Faalt met exit 1; verwijdert niets.

name: LAT-12798 disk cleanup (VPS host)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'measure = alleen lezen; apply = uitgeschakeld (LAT-13687)'
        required: true
        default: measure
        type: choice
        options:
          - measure
          - apply

concurrency:
  group: lat12798-disk-cleanup
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          cat >> ~/.ssh/config <<EOF
          Host $VPS_HOST
            StrictHostKeyChecking accept-new
            UserKnownHostsFile ~/.ssh/known_hosts
          EOF
          cat "$GITHUB_WORKSPACE/ops/ssh-config-snippet" >> ~/.ssh/config
          ssh-keyscan "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Measure (read-only)
        if: inputs.mode == 'measure'
        env:
          VPS: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
        run: |
          ssh "$VPS" "bash -s" <<'REMOTE'
          set -uo pipefail
          echo "=== df / ==="; df -h /
          echo "=== docker system df ==="; docker system df
          echo "=== docker system df -v (volumes) ==="; docker system df -v 2>/dev/null | sed -n '/Local Volumes space usage/,/Build cache usage/p' | head -40
          echo "=== /var/lib/docker (top) ==="; du -xsh /var/lib/docker/* 2>/dev/null | sort -h | tail -8
          echo "=== volumes (top 12) ==="; du -sh /var/lib/docker/volumes/* 2>/dev/null | sort -h | tail -12
          echo "=== containers json-log (top 8) ==="; du -sh /var/lib/docker/containers/*/*-json.log 2>/dev/null | sort -h | tail -8
          echo "=== / depth 1 (top 10) ==="; du -xh --max-depth=1 / 2>/dev/null | sort -h | tail -10
          echo "=== /var/log + journal ==="; du -sh /var/log /var/log/journal 2>/dev/null
          # LAT-13687: uitbreiding na schijf 98 % (16-10). /root groeide 2,4G -> 7,8G sinds aug.
          echo "=== HOME (\$HOME) depth 3 (top 25) ==="; du -xh --max-depth=3 "$HOME" 2>/dev/null | sort -h | tail -25
          echo "=== /docker depth 2 (top 10) ==="; du -xh --max-depth=2 /docker 2>/dev/null | sort -h | tail -10
          echo "=== /srv depth 2 (top 15) ==="; du -xh --max-depth=2 /srv 2>/dev/null | sort -h | tail -15
          echo "=== /srv/vino-builds ==="; ls -la /srv/vino-builds 2>&1 | head -30
          echo "=== dist.old-* ==="; ls -1d /srv/*/dist.old-* 2>/dev/null | while read -r d; do du -sh "$d"; done
          echo "=== images (id, naam, grootte, containers) ==="
          docker images --format '{{.ID}} {{.Repository}}:{{.Tag}} {{.Size}}' | while read -r i n z; do
            echo "$i $n $z containers=$(docker ps -a --filter "ancestor=$i" -q | wc -l)"
          done
          echo "=== housekeeping log (tail) ==="; tail -n 20 /var/log/paperclip-housekeeping-emergency.log 2>&1
          echo "LAT12798_MEASURE_OK"
          REMOTE

      - name: Apply (UITGESCHAKELD, LAT-13687)
        if: inputs.mode == 'apply'
        run: |
          # LAT-13687 (2026-10-16): de vorige apply ging uit van twee onjuiste aannames.
          # (1) ghcr.io/hostinger/hvps-openclaw:latest is NIET ongebruikt: openclaw-mrms-openclaw-1
          #     draait erop (hostmeting 12:15/12:28 NL). (2) de dangling-volume-heuristiek bewijst
          #     niet dat de inhoud herstelbaar is. Elke verwijdering vraagt een nieuw, per object
          #     benoemd besluit op basis van de measure-output. Tot dan doet apply niets.
          echo "::error::apply uitgeschakeld (LAT-13687); gebruik mode=measure"
          exit 1
