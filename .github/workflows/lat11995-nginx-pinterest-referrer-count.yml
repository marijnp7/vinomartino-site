# LAT-11995 / LAT-12050 — wekelijkse telling van de Pinterest-referrer in het
# vinomartino nginx-access-log (groeiplan taak 6.2, fallback zolang site_events
# (taak 1.5) nog niet bestaat).
#
# Goedgekeurd: approval f314a2c5 (2026-09-29). Route: hetzelfde GHA->VPS SSH-kanaal
# als .github/workflows/lat3214-docker-log-rotation.yml — geen broker-ACL nodig,
# dit is een volwaardige host-shell buiten de scoped docker-broker om. Nodig omdat
# zowel de docker-socket-proxy als `docker exec` naar paperclip-devops-workspace-1
# op 2026-09-29 elke docker logs/inspect-aanroep met "scoped broker: forbidden"
# weigerden, ook alleen-lezen (LAT-6001-verharding).
#
# EEN mode, alleen-lezen: `count`. Niets interpoleert in het SSH-commando behalve
# `since` (een vaste Docker --since duration-syntax, bv. "168h" voor een week) --
# geen vrije shell-input. Nginx (nginx-prod.conf, geen eigen log_format) gebruikt
# het ingebouwde "combined" format en het officiele nginx:alpine-image symlinkt
# access.log naar stdout, dus `docker logs` op de nginx-container (paperclip-
# vinomartino-prod-1) is de volledige access-log. Output is UITSLUITEND een getal
# + het venster -- geen IP's, geen ruwe logregels, geen user-agents (LAT-11995-eis).
#
# LET OP bij het pushen: elk bestand onder .github/ op main triggert normaal een
# productie-release van vinomartino.com (deploy.yml gebruikt paths-ignore en
# .github/** staat daar bewust niet in). Daarom pushen met "[skip ci]" en daarna
# verifieren met:
#   gh run list --repo marijnp7/vinomartino-site --branch main --limit 5

name: LAT-11995 nginx Pinterest-referrer count

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'count = alleen lezen, telt Pinterest-referrers (bots eruit op user-agent)'
        required: true
        default: count
        type: choice
        options:
          - count
      since:
        description: 'Docker --since duration, bv. 168h voor een week'
        required: true
        default: 168h
        type: string

concurrency:
  group: lat11995-nginx-pinterest-referrer-count
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # LAT-3437: transport via de Cloudflare Tunnel (ssh.vinomartino.com),
          # niet via inbound poort 22.
          [ -n "$CF_ACCESS_CLIENT_ID" ] && [ -n "$CF_ACCESS_CLIENT_SECRET" ] \
            || { echo "::error::CF_ACCESS_CLIENT_ID/SECRET ontbreken (LAT-3437)"; exit 1; }
          umask 077
          printf 'CF_ACCESS_CLIENT_ID=%s\nCF_ACCESS_CLIENT_SECRET=%s\n' \
            "$CF_ACCESS_CLIENT_ID" "$CF_ACCESS_CLIENT_SECRET" > ~/.ssh/cf-access.env
          umask 022
          cat >> ~/.ssh/config <<EOF
          Host $VPS_HOST
            StrictHostKeyChecking accept-new
            UserKnownHostsFile ~/.ssh/known_hosts
            ProxyCommand bash $GITHUB_WORKSPACE/ops/cf-ssh-proxy.sh
          EOF
          cat "$GITHUB_WORKSPACE/ops/ssh-config-snippet" >> ~/.ssh/config

      # ---------------------------------------------------------------- count
      - name: Count Pinterest-referrer hits (read-only)
        if: inputs.mode == 'count'
        env:
          VPS: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          SINCE: ${{ inputs.since }}
          COUNT: |
            set -uo pipefail
            echo "=== venster ==="
            echo "since=$SINCE"
            date -u +"generated_at=%Y-%m-%dT%H:%M:%SZ"
            echo

            echo "=== container-status ==="
            docker inspect -f '{{.State.Status}}' paperclip-vinomartino-prod-1 2>&1 || echo "CONTAINER NIET GEVONDEN"
            echo

            echo "=== pinterest-referrer telling (bots eruit op user-agent, geen IP's/ruwe regels in output) ==="
            docker logs --since "$SINCE" paperclip-vinomartino-prod-1 2>&1 \
              | awk -F'"' 'NF>=6 { print tolower($4) "\t" tolower($6) }' \
              | awk -F'\t' '
                  $1 ~ /pinterest/ { total++ }
                  $1 ~ /pinterest/ && $2 !~ /bot|crawl|spider/ { counted++ }
                  END {
                    printf "pinterest_referrer_total=%d\n", total+0
                    printf "pinterest_referrer_excl_bots=%d\n", counted+0
                  }
                '
        run: |
          printf '%s\n' "$COUNT" | ssh "$VPS" "bash -s"
