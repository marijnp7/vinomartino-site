# LAT-5226 — roteer BETTER_AUTH_SECRET van de Paperclip control-plane (dispatch-only, VPS SSH-kanaal).
#
# Achtergrond: LAT-3810 / LAT-5226. `BETTER_AUTH_SECRET` staat onbeheerd (geen
# company_secrets-rij) in 12 gedeelde-volume-bestanden + 16 DB-dumps en is leesbaar via
# /proc/1/environ voor elke agent (uid 1000). Containment staat al (unset in
# /paperclip/bin/claude, 0 nieuwe kopieen in 7 dagen). Rotatie is de enige stap die de
# bestaande kopieen waardeloos maakt.
#
# Route: hetzelfde GHA->VPS SSH-kanaal als lat3228/lat4750/lat2802 (LAT-5144) — draait op
# de host, buiten elke container om, dus de scoped docker-broker (die exec/inspect op
# paperclip-paperclip-1/db blokkeert, zie LAT-3718/LAT-3776) is hier niet de beperking.
#
# `mode` kiest alleen tussen vaste, niet-geinterpoleerde scripts:
#   diagnose = alleen lezen. Vindt de live container door de sha256(8) van zijn huidige
#              BETTER_AUTH_SECRET te vergelijken met de bekende oude hash (nooit de waarde
#              zelf printen) en rapporteert working_dir/project/service/config_files via
#              de com.docker.compose.* labels. Wijzigt niets.
#   rotate   = genereert een nieuwe 64-hex waarde MET `openssl rand -hex 32` ON HOST, in
#              dezelfde SSH-sessie — de waarde verlaat de host nooit, komt nooit in dit
#              workflow-log en nooit in het gedeelde /paperclip-volume. Vereist dat de
#              waarde als een losse `BETTER_AUTH_SECRET=...`-regel in een `.env` naast de
#              compose working_dir staat; breekt anders veilig af zonder iets te wijzigen.
#              Doet `docker compose ... up -d <service>` (recreate, geen `restart` — env
#              wordt bij create gelezen) en verifieert erna dat de hash daadwerkelijk
#              veranderd is.
#
# Herstart PID 1 van het control plane: elke lopende better-auth-sessie verloopt, dus
# Marijn wordt uitgelogd uit het board. Dat is de reden dat `rotate` niet zonder expliciete
# afstemming over de timing gedispatcht wordt — zie LAT-5226 comment thread.
#
# LET OP bij het pushen: elk bestand onder .github/ op main triggert normaal een
# productie-release van vinomartino.com (deploy.yml gebruikt paths-ignore en .github/**
# staat daar bewust niet in). Pushen met "[skip ci]" en daarna verifieren met
#   gh run list --repo marijnp7/vinomartino-site --branch main --limit 5

name: LAT-5226 rotate BETTER_AUTH_SECRET

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'diagnose = alleen lezen; rotate = daadwerkelijk roteren + up -d'
        required: true
        default: diagnose
        type: choice
        options:
          - diagnose
          - rotate

concurrency:
  group: lat5226-rotate-better-auth-secret
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          cat >> ~/.ssh/config <<EOF
          Host $VPS_HOST
            StrictHostKeyChecking accept-new
            UserKnownHostsFile ~/.ssh/known_hosts
          EOF
          cat "$GITHUB_WORKSPACE/ops/ssh-config-snippet" >> ~/.ssh/config
          ssh-keyscan "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      # ---------------------------------------------------------------- diagnose
      - name: Diagnose (read-only, geen enkele write)
        if: inputs.mode == 'diagnose'
        env:
          VPS: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          DIAG: |
            set -uo pipefail
            OLDHASH_PREFIX="631365be"

            echo "=== zoek container met de bekende oude BETTER_AUTH_SECRET-hash ==="
            TARGET=""
            for c in $(docker ps --format '{{.Names}}'); do
              v=$(docker exec "$c" sh -c 'echo "$BETTER_AUTH_SECRET"' 2>/dev/null || true)
              [ -z "$v" ] && continue
              h=$(printf '%s' "$v" | sha256sum | cut -c1-8)
              unset v
              echo "  $c sha256(8)=$h"
              if [ "$h" = "$OLDHASH_PREFIX" ]; then TARGET="$c"; fi
            done

            if [ -z "$TARGET" ]; then
              echo "GEEN container gevonden met hash-prefix $OLDHASH_PREFIX."
              echo "Dit kan betekenen: (a) de host heeft geen zicht op deze container via"
              echo "'docker ps' vanaf deze SSH-sessie, of (b) de waarde staat al niet meer"
              echo "op $OLDHASH_PREFIX. Rotatie NIET proberen zonder dit eerst te verklaren."
              exit 1
            fi

            echo "=== gevonden: $TARGET ==="
            docker inspect -f 'image={{.Image}} created={{.Created}} status={{.State.Status}}' "$TARGET"
            WD=$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project.working_dir" }}' "$TARGET")
            PROJ=$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project" }}' "$TARGET")
            SERVICE=$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.service" }}' "$TARGET")
            CFGFILES=$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project.config_files" }}' "$TARGET")
            echo "working_dir=$WD"
            echo "project=$PROJ"
            echo "service=$SERVICE"
            echo "config_files=$CFGFILES"

            echo "=== .env in working_dir? (alleen aanwezigheid + of de KEY erin staat, nooit de waarde) ==="
            if [ -n "$WD" ] && [ -f "$WD/.env" ]; then
              echo "AANWEZIG $WD/.env"
              if grep -q '^BETTER_AUTH_SECRET=' "$WD/.env"; then
                echo "BETTER_AUTH_SECRET staat als losse regel in .env — rotate-mode kan hier direct op werken"
              else
                echo "BETTER_AUTH_SECRET staat NIET als losse regel in .env — rotate-mode zal veilig afbreken"
              fi
            else
              echo "GEEN .env gevonden in working_dir — rotate-mode zal veilig afbreken"
            fi

            echo "=== compose-validatie (geen output, alleen exitcode) ==="
            if [ -n "$WD" ]; then
              cd "$WD"
              IFS=':' read -ra CFGARR <<< "$CFGFILES"
              FARGS=()
              for f in "${CFGARR[@]}"; do FARGS+=(-f "$f"); done
              if docker compose -p "$PROJ" --project-directory "$WD" "${FARGS[@]}" config --quiet 2>/tmp/lat5226-cfg.err; then
                echo CONFIG_OK
              else
                echo CONFIG_FAIL
                sed -E 's/[A-Za-z0-9_-]{20,}/<redacted>/g' /tmp/lat5226-cfg.err
              fi
            fi
        run: |
          printf '%s\n' "$DIAG" | ssh "$VPS" "bash -s"

      # ---------------------------------------------------------------- rotate
      - name: Roteer + recreate (up -d, niet restart)
        if: inputs.mode == 'rotate'
        env:
          VPS: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          ROTATE: |
            set -euo pipefail
            OLDHASH_PREFIX="631365be"

            TARGET=""
            for c in $(docker ps --format '{{.Names}}'); do
              v=$(docker exec "$c" sh -c 'echo "$BETTER_AUTH_SECRET"' 2>/dev/null || true)
              [ -z "$v" ] && continue
              h=$(printf '%s' "$v" | sha256sum | cut -c1-8)
              unset v
              if [ "$h" = "$OLDHASH_PREFIX" ]; then TARGET="$c"; break; fi
            done
            [ -n "$TARGET" ] || { echo "::error::geen container gevonden met de bekende oude hash — afgebroken, niets gewijzigd"; exit 1; }
            echo "gevonden: $TARGET"

            WD=$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project.working_dir" }}' "$TARGET")
            PROJ=$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project" }}' "$TARGET")
            SERVICE=$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.service" }}' "$TARGET")
            CFGFILES=$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project.config_files" }}' "$TARGET")
            [ -n "$WD" ] || { echo "::error::geen working_dir-label — afgebroken"; exit 1; }
            echo "working_dir=$WD project=$PROJ service=$SERVICE config_files=$CFGFILES"
            cd "$WD"

            ENVFILE="$WD/.env"
            if [ -f "$ENVFILE" ] && grep -q '^BETTER_AUTH_SECRET=' "$ENVFILE"; then
              NEWVAL=$(openssl rand -hex 32)
              sed -i "s#^BETTER_AUTH_SECRET=.*#BETTER_AUTH_SECRET=${NEWVAL}#" "$ENVFILE"
              unset NEWVAL
              echo "BETTER_AUTH_SECRET bijgewerkt in $ENVFILE"
            else
              echo "::error::BETTER_AUTH_SECRET niet gevonden als losse regel in $ENVFILE — geen andere bron ondersteund door dit script, afgebroken zonder wijziging. Draai eerst mode=diagnose en pas dit script aan op de echte bron."
              exit 1
            fi

            IFS=':' read -ra CFGARR <<< "$CFGFILES"
            FARGS=()
            for f in "${CFGARR[@]}"; do FARGS+=(-f "$f"); done

            echo "=== validatie vooraf ==="
            docker compose -p "$PROJ" --project-directory "$WD" "${FARGS[@]}" config --quiet
            echo CONFIG_OK

            echo "=== RECREATE ($SERVICE) ==="
            docker compose -p "$PROJ" --project-directory "$WD" "${FARGS[@]}" up -d "$SERVICE"

            echo "=== verificatie ==="
            sleep 3
            NV=$(docker exec "$TARGET" sh -c 'echo "$BETTER_AUTH_SECRET"' 2>/dev/null)
            NH=$(printf '%s' "$NV" | sha256sum | cut -c1-8)
            unset NV
            if [ "$NH" = "$OLDHASH_PREFIX" ]; then
              echo "::error::hash ONVERANDERD na recreate — rotatie is NIET gelukt"
              exit 1
            fi
            echo "geverifieerd: nieuwe sha256(8)=$NH (oud was $OLDHASH_PREFIX) — rotatie geslaagd"
        run: |
          printf '%s\n' "$ROTATE" | ssh "$VPS" "bash -s"

      # Geen backup van de oude waarde op de host: die waarde is het hele punt van dit
      # ticket juist waardeloos maken, een kopie ervan bewaren zou de rotatie ondermijnen.
      # Komt de container niet gezond op na de recreate: los dat op met een NIEUWE rotate-
      # dispatch (opnieuw vooruit, niet terug naar de gecompromitteerde waarde) en
      # inspecteer de container-logs voor de onderliggende oorzaak.
