# LAT-3260 — dispatch-only patch van de devops-workspace compose-bron naar de named volume.
#
# Goedgekeurd: kaart cee97089 ("LAT-3260: patch devops-workspace overlay naar de named volume
# (1 regel)", goedgekeurd 2026-08-12T11:11:38Z). Route volgt het precedent van
# lat3228-devops-workspace-volume-cutover.yml (kaart c61e0f46) en
# lat3591-activate-scoped-broker-acl.yml: agent voert uit via het bestaande GHA->VPS SSH-kanaal
# (secrets.VPS_SSH_PRIVATE_KEY) in plaats van een handmatige host-shell.
#
# WAAROM DIT NA LAT-3228: de cutover (c61e0f46) verplaatste de LIVE container-mount naar
# paperclip_devops2-home, maar de compose-BRON op de host bleef bij de oude naam wijzen. Een
# volgende `docker compose up -d` op /opt/paperclip zou de cutover stilzwijgend terugdraaien.
# Deze workflow patcht alleen het bestand, geen `docker compose up` als onderdeel hiervan.
#
# Scope volgens de approval (afwijkend van de oorspronkelijke issue-tekst, die uitging van een
# ${PAPERCLIP_VOLUME_NAME:?...} env-var-substitutie -- dat deel is achterhaald, geverifieerd
# tegen de live `docker compose config`): het bestand heeft nu de anonieme volume-hash
# hardcoded onder top-level `volumes: paperclip_vol:`, gebruikt door precies één service.
# Patch is een 1-regel name-swap, geen env-var-route.
#
# Geen push-trigger. `mode` kiest alleen tussen vaste scripts; er wordt niets uit de input
# in een commando geinterpoleerd. Waarden staan als letterlijke tekst IN de script-body (niet
# als GHA `env:`/$VAR-referenties) omdat SSH de lokale job-env niet doorgeeft aan de remote
# shell -- eerdere versie brak hierop (run 31590998844, "COMPOSE_FILE: unbound variable").
# `diagnose` schrijft de live sha256 naar de run-log zodat die in de `patch`-stap als
# EXPECTED_OLD_SHA256-guard bevestigd/bijgewerkt kan worden voor dispatch.
#
# LET OP bij het pushen: elk bestand onder .github/ op main triggert normaal een
# productie-release van vinomartino.com (deploy.yml gebruikt paths-ignore en .github/**
# staat daar bewust niet in). Daarom pushen met "[skip ci]" en daarna verifieren met
#   gh run list --repo marijnp7/vinomartino-site --branch main --limit 5

name: LAT-3260 compose-patch devops-workspace volume

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'diagnose = alleen lezen (sha256 + huidige name:-regel); patch = daadwerkelijk de name: regel swappen'
        required: true
        default: diagnose
        type: choice
        options:
          - diagnose
          - patch

concurrency:
  group: lat3260-compose-patch-devops-workspace-volume
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          cat >> ~/.ssh/config <<EOF
          Host $VPS_HOST
            StrictHostKeyChecking accept-new
            UserKnownHostsFile ~/.ssh/known_hosts
          EOF
          cat "$GITHUB_WORKSPACE/ops/ssh-config-snippet" >> ~/.ssh/config
          ssh-keyscan "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      # ---------------------------------------------------------------- diagnose
      # LET OP: SSH geeft de lokale GHA-env NIET door aan de remote shell (geen SendEnv/
      # AcceptEnv). Waarden staan daarom hieronder als letterlijke tekst in het script, niet
      # als $VAR-referenties -- eerdere versie brak op "COMPOSE_FILE: unbound variable" (run
      # 31590998844) omdat $COMPOSE_FILE op de VPS nergens gezet was.
      - name: Diagnose (read-only)
        if: inputs.mode == 'diagnose'
        env:
          VPS: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          DIAG: |
            set -uo pipefail
            F=/opt/paperclip/infra/devops-workspace/docker-compose.devops.yml
            OLD=6e70e905369b205ceebde64c2bc96dd8a204ddd7d10f43ecd7b36c659062ead1
            NEW=paperclip_devops2-home

            echo "=== bestaat het bestand? ==="
            ls -la "$F" 2>&1

            echo "=== sha256 (nooit inhoud printen) ==="
            sha256sum "$F" 2>&1

            echo "=== hoeveel regels noemen de oude anonieme naam? ==="
            grep -c "$OLD" "$F" 2>&1 || echo 0

            echo "=== hoeveel regels noemen de nieuwe naam al? ==="
            grep -c "$NEW" "$F" 2>&1 || echo 0

            echo "=== huidige LIVE mount van paperclip-devops-workspace-1 (ter vergelijking) ==="
            docker inspect -f '{{range .Mounts}}{{if eq .Destination "/paperclip"}}{{.Name}} {{.Source}}{{end}}{{end}}' \
              paperclip-devops-workspace-1 2>&1

            echo "=== docker compose config (base + overlay, zoals echt aangeroepen -- zie apply-compose-patch.sh regel 54) ==="
            cd /opt/paperclip
            OUT=$(docker compose -f docker-compose.yml -f infra/devops-workspace/docker-compose.devops.yml config 2>&1); RC=$?
            echo "$OUT" | grep -A3 'paperclip_vol:' || true
            if [ "$RC" != "0" ]; then
              echo "=== docker compose config (base+overlay) faalde (rc=$RC); laatste 15 regels ==="
              echo "$OUT" | tail -15
            fi
        run: |
          printf '%s\n' "$DIAG" | ssh "$VPS" "bash -s"

      # ---------------------------------------------------------------- patch
      # EXPECTED_OLD_SHA256 hieronder is bevestigd via diagnose-run 31591228140
      # (2026-08-12T11:18:16Z): live sha256 = 3708073599bddafb...5b8a67, precies 1 regel met
      # OLD, 0 met NEW. `apply-compose-patch.sh` (het precedent-script) bleek zelf ON HOLD te
      # staan en te controleren op een verouderd PAPERCLIP_VOLUME_NAME-patroon dat niet meer
      # in het live bestand voorkomt (0 treffers) -- dat script wordt hier NIET gebruikt, deze
      # stap doet zijn eigen sed-vervanging op het huidige, geverifieerde live patroon.
      # docker compose config faalt standalone op dit overlay-bestand ("paperclip service has
      # neither an image nor a build context") -- de echte aanroep combineert de base-file,
      # bevestigd uit apply-compose-patch.sh regel 54: cd /opt/paperclip && docker compose
      # -f docker-compose.yml -f infra/devops-workspace/docker-compose.devops.yml config.
      - name: Patch compose volume name
        if: inputs.mode == 'patch'
        env:
          VPS: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          PATCH: |
            set -euo pipefail
            F=/opt/paperclip/infra/devops-workspace/docker-compose.devops.yml
            OLD=6e70e905369b205ceebde64c2bc96dd8a204ddd7d10f43ecd7b36c659062ead1
            NEW=paperclip_devops2-home
            EXPECTED_OLD_SHA256=3708073599bddafb35d65690de35bcee367eea71716046ba9c06f844be5b8a67

            echo "=== guard: live sha256 moet exact matchen met de bevestigde waarde ==="
            CUR_SHA=$(sha256sum "$F" | cut -d' ' -f1)
            if [ "$CUR_SHA" != "$EXPECTED_OLD_SHA256" ]; then
              echo "::error::live $F is gewijzigd sinds de approval; afgebroken zonder iets aan te raken (huidige sha256: $CUR_SHA)"
              exit 1
            fi

            echo "=== guard: precies 1 regel met de oude naam, 0 met de nieuwe ==="
            OLD_COUNT=$(grep -c "$OLD" "$F")
            NEW_COUNT=$(grep -c "$NEW" "$F" || true)
            if [ "$OLD_COUNT" != "1" ]; then
              echo "::error::verwachtte precies 1 regel met $OLD, vond $OLD_COUNT; afgebroken"
              exit 1
            fi
            if [ "$NEW_COUNT" != "0" ]; then
              echo "::error::$NEW komt al voor in het bestand; afgebroken (mogelijk al gepatcht)"
              exit 1
            fi

            BACKUP="${F}.bak-lat3260-$(date -u +%Y%m%dT%H%M%SZ)"
            cp -p "$F" "$BACKUP"
            echo "backup: $BACKUP"

            echo "=== VOOR (sha256) ==="
            sha256sum "$F"

            sed -i "s/$OLD/$NEW/" "$F"

            echo "=== NA (sha256) ==="
            sha256sum "$F"

            echo "=== validatie: docker compose config (base + overlay, zoals echt aangeroepen) moet de nieuwe naam tonen ==="
            cd /opt/paperclip
            docker compose -f docker-compose.yml -f infra/devops-workspace/docker-compose.devops.yml config \
              >/tmp/lat3260-config.out 2>&1 || true
            if ! grep -q "$NEW" /tmp/lat3260-config.out; then
              echo "::error::docker compose config (base+overlay) toont $NEW niet na de patch; rol terug met: cp -p $BACKUP $F"
              tail -20 /tmp/lat3260-config.out
              exit 1
            fi
            echo "CONFIG_OK: $NEW zichtbaar in docker compose config (base+overlay)"
            grep -A3 'paperclip_vol:' /tmp/lat3260-config.out

            echo "=== nogmaals: geen 'docker compose up' hier; dat is uitdrukkelijk buiten scope ==="
        run: |
          printf '%s\n' "$PATCH" | ssh "$VPS" "bash -s"

      # Rollback (handmatig, backup blijft liggen met tijdstempel in de naam):
      #   ssh "$VPS" 'cp -p /opt/paperclip/infra/devops-workspace/docker-compose.devops.yml.bak-lat3260-<TIMESTAMP> \
      #     /opt/paperclip/infra/devops-workspace/docker-compose.devops.yml'
