# LAT-8794 — dispatch-only herstart van paperclip-paperclip-1 (control-plane PID 1) om de
# vastgelopen in-app backup-lock (databaseBackupInFlight) vrij te geven, plus de bijbehorende
# herstart van paperclip-bridge-forward (deelt de netwerk-namespace, komt niet vanzelf terug).
#
# Geautoriseerd: direct in-thread door de board (comment 794f21ea op LAT-8794, 2026-09-09 08:15Z,
# gemeten op de host: container-topologie + restart-policy). Geen aparte approval-kaart -- de
# board-comment zelf is het besluit, met expliciete instructie om de zes-dagen-kaart-route hier
# over te slaan omdat beide containers `unless-stopped` zijn (omkeerbaar) en er aantoonbaar geen
# dataverlies dreigt (externe 6-uurlijkse dump-pipeline blijft groen). Route volgt het precedent
# van lat5247/lat3260/lat4750: agent voert uit via het bestaande GHA->VPS SSH-kanaal.
#
# Geen push-trigger. `mode` kiest alleen tussen vaste scripts; er wordt niets uit de input in een
# commando geinterpoleerd.
#
# Restart-volgorde (uit de board-comment, niet zelf verzonnen):
#   1. docker restart paperclip-paperclip-1
#   2. wachten tot het control-plane-proces weer "Server listening" logt (autoritatieve
#      restart-marker, zie [[cto-agent-draait-in-de-control-plane]] -- NIET /proc, dat geeft
#      alleen container-uptime, geen proces-leeftijd)
#   3. docker restart paperclip-bridge-forward (netwerk-namespace-joiner, komt niet vanzelf terug)
#   4. verificatie blijft aan DevOps na deze run: server.log skip/complete-regel +
#      backup-failure-streak-check.py
#
# LET OP: dit bestand herstart NOOIT de Docker-daemon zelf (zie lat3214-docker-log-rotation.yml)
# -- dat blijft een apart voorstel met eigen Marijn-gate + stiltevenster. Eén container herstarten
# is een kleinere, omkeerbare ingreep binnen de hierboven genoemde board-autorisatie.
#
# LET OP bij het pushen: elk bestand onder .github/ op main triggert normaal een productie-release
# van vinomartino.com (deploy.yml gebruikt paths-ignore en .github/** staat daar bewust niet in).
# Daarom pushen met "[skip ci]" en daarna verifieren met:
#   gh run list --repo marijnp7/vinomartino-site --branch main --limit 5

name: LAT-8794 restart paperclip control plane

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'diagnose = alleen lezen (restart policy, uptime, laatste log-regels); restart = daadwerkelijk herstarten (stap 1-3)'
        required: true
        default: diagnose
        type: choice
        options:
          - diagnose
          - restart

concurrency:
  group: lat8794-restart-paperclip-control-plane
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          cat >> ~/.ssh/config <<EOF
          Host $VPS_HOST
            StrictHostKeyChecking accept-new
            UserKnownHostsFile ~/.ssh/known_hosts
          EOF
          cat "$GITHUB_WORKSPACE/ops/ssh-config-snippet" >> ~/.ssh/config
          ssh-keyscan "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      # ---------------------------------------------------------------- diagnose
      - name: Diagnose (read-only)
        if: inputs.mode == 'diagnose'
        env:
          VPS: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          DIAG: |
            set -uo pipefail

            echo "=== paperclip-paperclip-1: restart policy, uptime, id ==="
            docker inspect paperclip-paperclip-1 \
              --format '{{.Id}} started={{.State.StartedAt}} restartpolicy={{.HostConfig.RestartPolicy.Name}} restartcount={{.RestartCount}} status={{.State.Status}}' 2>&1

            echo "=== paperclip-bridge-forward: network mode, uptime, id ==="
            docker inspect paperclip-bridge-forward \
              --format '{{.Id}} started={{.State.StartedAt}} networkmode={{.HostConfig.NetworkMode}} restartpolicy={{.HostConfig.RestartPolicy.Name}} status={{.State.Status}}' 2>&1

            echo "=== does bridge-forward actually join paperclip-paperclip-1's netns right now? ==="
            PCID=$(docker inspect -f '{{.Id}}' paperclip-paperclip-1 2>&1)
            docker inspect paperclip-bridge-forward --format '{{.HostConfig.NetworkMode}}' 2>&1 | grep -q "$PCID" \
              && echo "MATCH: bridge-forward netns points at the current paperclip-paperclip-1 id" \
              || echo "NO MATCH (or lookup failed) -- see raw NetworkMode value above"

            echo "=== last 5 backup-related log lines (docker logs, not server.log -- LAT-4930/pino risk) ==="
            docker logs --tail 200 paperclip-paperclip-1 2>&1 | grep -i 'database backup' | tail -5

            echo "=== last 3 'Server listening' boundaries ==="
            docker logs --tail 5000 paperclip-paperclip-1 2>&1 | grep -i 'Server listening' | tail -3
        run: |
          printf '%s\n' "$DIAG" | ssh "$VPS" "bash -s"

      # ---------------------------------------------------------------- restart
      - name: Restart control plane + bridge-forward
        if: inputs.mode == 'restart'
        env:
          VPS: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          RESTART: |
            set -uo pipefail

            echo "=== BEFORE: restart policy guard (abort if either container isn't unless-stopped) ==="
            PC_POLICY=$(docker inspect -f '{{.HostConfig.RestartPolicy.Name}}' paperclip-paperclip-1 2>&1)
            BF_POLICY=$(docker inspect -f '{{.HostConfig.RestartPolicy.Name}}' paperclip-bridge-forward 2>&1)
            echo "paperclip-paperclip-1 restart policy: $PC_POLICY"
            echo "paperclip-bridge-forward restart policy: $BF_POLICY"
            if [ "$PC_POLICY" != "unless-stopped" ] || [ "$BF_POLICY" != "unless-stopped" ]; then
              echo "::error::verwachtte unless-stopped op beide containers; afgebroken zonder iets aan te raken"
              exit 1
            fi

            MARK=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            echo "=== marker timestamp voor log-polling: $MARK ==="

            echo "=== stap 1: docker restart paperclip-paperclip-1 ==="
            docker restart paperclip-paperclip-1

            echo "=== stap 2: wachten op 'Server listening' NA $MARK (max 5 min) ==="
            UP=0
            for i in $(seq 1 30); do
              if docker logs --since "$MARK" paperclip-paperclip-1 2>&1 | grep -q 'Server listening'; then
                UP=1
                echo "control plane is terug (poging $i)"
                break
              fi
              sleep 10
            done
            if [ "$UP" != "1" ]; then
              echo "::error::geen 'Server listening' binnen 5 minuten na de restart -- bridge-forward NIET herstart, handmatig onderzoek nodig"
              docker logs --tail 50 paperclip-paperclip-1 2>&1
              exit 1
            fi

            echo "=== stap 3: docker restart paperclip-bridge-forward ==="
            docker restart paperclip-bridge-forward

            echo "=== stap 3 verificatie: bridge-forward status na herstart ==="
            sleep 3
            docker inspect paperclip-bridge-forward --format 'status={{.State.Status}} started={{.State.StartedAt}}' 2>&1

            echo "=== klaar. Verificatie van de backup-streak zelf gebeurt buiten deze workflow (server.log + backup-failure-streak-check.py). ==="
        run: |
          printf '%s\n' "$RESTART" | ssh "$VPS" "bash -s"
