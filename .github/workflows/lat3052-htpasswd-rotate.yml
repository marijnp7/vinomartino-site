# LAT-5462 / LAT-3052 — dispatch-only rotatie van de prod basic-auth (htpasswd)
# op paperclip-vinomartino-prod-1, via het GHA->VPS SSH-kanaal.
#
# GOEDKEURING — twee losse handelingen, allebei al gedekt, GEEN nieuwe kaart:
#   * de actie zelf  : kaart 8cf529bf (Marijn, 2026-08-12 13:44:55Z)
#   * de route       : kaart 933eff00 (2026-08-12 06:29:24Z), eerder hergebruikt in
#                      lat4750-recreate-publish-dispatcher.yml, lat5247-scoped-broker-restart.yml
#                      en lat5382-scoped-broker-bindmode.yml.
# Goedkeuren en uitvoeren zijn twee handelingen; kaart 933eff00 zegt expliciet dat een
# agent een al goedgekeurd VPS-commando zelf via dit CI-kanaal mag uitvoeren.
#
# WAAROM DE ROTATIE ALLEEN OP DE HOST NIET GENOEG IS  <-- de kern van dit bestand
# `htpasswd` staat IN de repo (45 bytes, 1 regel, gebruiker `marijn`, $apr1$-formaat) en
# deploy.yml stap 7 kopieert hem bij ELKE productie-deploy terug naar de host:
#     CONFIG_FILES="nginx-prod.conf nginx-preview.conf htpasswd docker-compose...*.yml"
#     cp "$STAGE/$f" "$SITE_ROOT/$f"
# Roteer je alleen host-side, dan zet de eerstvolgende deploy de oude hash stilzwijgend
# terug en is de rotatie ongedaan zonder dat iemand het ziet. Daarom roteert `apply`
# de host EN commit de nieuwe hash naar deze repo; mislukt de commit, dan wordt de host
# automatisch teruggerold zodat repo en host nooit uit elkaar lopen.
#
# INODE-REGEL. /root/vinomartino-site/htpasswd hangt als PER-BESTAND bind-mount in de
# container (`./htpasswd:/etc/nginx/.htpasswd:ro`). `mv`/`sed -i` maken een nieuwe inode;
# de mount blijft dan aan de oude hangen en de container leest eeuwig de oude waarde,
# terwijl een `cat` van het hostpad de nieuwe toont. Er wordt daarom in-place geschreven
# (`> "$F"`) en `stat -c %i` wordt voor en na vergeleken. Zelfde regel voor de rollback,
# vandaar `cp` (O_TRUNC, zelfde inode) en niet `mv`.
#
# SECRET-HYGIENE (LAT-3641/LAT-3644). Het nieuwe wachtwoord wordt op de host binnen de
# SSH-sessie gegenereerd en verlaat die host niet. Het staat niet in deze workflow, niet
# in de run-log, niet in een GitHub-secret en niet in een issue-comment. Gerapporteerd
# worden alleen lengte + sha256-prefix. curl krijgt de credential via `--config -` op
# stdin en niet via `-u`, anders staat hij in `ps` op de host. De opgeslagen waarde komt
# op /root/vinomartino-site/.htpasswd-marijn.cred (0600, root-only) te staan.
# De HASH is een andere klasse: die staat vandaag al in de repo en wordt daar ook weer
# gecommit, dus die reist wel — maar via `ssh cat > bestand`, niet via de log.
#
# TERUGTOETS — wat wel en niet bewezen kan worden. De opdracht vroeg "oud wachtwoord
# geeft 401". Dat is niet toetsbaar: van de oude credential bestaat alleen de $apr1$-hash,
# niemand heeft de plaintext. Wat wel falsifieerbaar getoetst wordt:
#   1. voor de rotatie  : geen credential -> 401   (de route is echt afgeschermd)
#   2. na de rotatie    : nieuw wachtwoord -> NIET 401
#   3. na de rotatie    : fout wachtwoord  -> 401   (negatieve controle; zonder deze
#      zou stap 2 ook groen zijn als auth per ongeluk helemaal uit stond)
#   4. de oude hash komt niet meer voor in het bestand (sha256-vergelijking)
# Verdict op /intern/ is 401 vs NIET-401, niet 200 vs de rest: nginx doet daar
# `try_files $uri $uri/ =404`, dus een geslaagde auth kan legitiem 404 opleveren.
#
# LET OP bij het pushen van dit bestand: elk bestand onder .github/ op main triggert
# normaal een productie-release (deploy.yml gebruikt paths-ignore en .github/** staat daar
# bewust niet in). Push dus met "[skip ci]" en verifieer daarna per sha:
#   gh run list --repo marijnp7/vinomartino-site --limit 20 \
#     --json databaseId,headSha,workflowName --jq '.[]|select(.headSha=="<sha>")'
# Datzelfde geldt voor de htpasswd-commit die `apply` zelf maakt — die draagt ook [skip ci].

name: LAT-3052 htpasswd rotate (prod)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'diagnose = alleen lezen; apply = roteren + terugtoetsen + hash committen; rollback = laatste backup terugzetten'
        required: true
        default: diagnose
        type: choice
        options:
          - diagnose
          - apply
          - verify
          - rollback

concurrency:
  group: lat3052-htpasswd-rotate
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          cat >> ~/.ssh/config <<EOF
          Host $VPS_HOST
            StrictHostKeyChecking accept-new
            UserKnownHostsFile ~/.ssh/known_hosts
          EOF
          cat "$GITHUB_WORKSPACE/ops/ssh-config-snippet" >> ~/.ssh/config
          ssh-keyscan "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      # =================================================================== diagnose
      - name: Diagnose (read-only)
        if: inputs.mode == 'diagnose'
        env:
          VPS: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          # Volledig gequote heredoc: er wordt niets runner-side geinterpoleerd en
          # niets uit `inputs` bereikt ooit een commando.
          cat > /tmp/lat5462-diag.sh <<'DIAGEOF'
          set -uo pipefail
          F=/root/vinomartino-site/htpasswd
          CTR=paperclip-vinomartino-prod-1

          echo "=== 1. bestaat het htpasswd-bestand, en hoe ziet het eruit (geen waarden) ==="
          if [ ! -f "$F" ]; then echo "::error::$F ontbreekt"; exit 1; fi
          stat -c 'pad=%n inode=%i mode=%a eigenaar=%U:%G bytes=%s gewijzigd=%y' "$F"
          echo "regels: $(wc -l < "$F")"
          echo "bestands-sha256: $(sha256sum "$F" | cut -c1-16)..."
          # Alleen gebruikersnaam + hashformaat + hash-sha256. Nooit de hash zelf.
          while IFS=: read -r U H; do
            [ -n "${U:-}" ] || continue
            printf 'gebruiker=%s hashformaat=%s hashlengte=%s hash-sha256=%s...\n' \
              "$U" "$(printf '%s' "$H" | cut -c1-6)" "${#H}" \
              "$(printf '%s' "$H" | sha256sum | cut -c1-16)"
          done < "$F"

          echo
          echo "=== 2. hangt hij echt read-only in de container? (smalle --format: geen .Config.Env) ==="
          docker inspect -f 'status={{.State.Status}} gestart={{.State.StartedAt}} restarts={{.RestartCount}}' "$CTR"
          docker inspect -f '{{range .Mounts}}{{.Source}} -> {{.Destination}} rw={{.RW}}{{println}}{{end}}' "$CTR"

          echo "=== 2b. ziet de container dezelfde inhoud als de host? ==="
          IN_CTR=$(docker exec "$CTR" sha256sum /etc/nginx/.htpasswd 2>&1 | cut -c1-16)
          ON_HOST=$(sha256sum "$F" | cut -c1-16)
          echo "container=$IN_CTR... host=$ON_HOST..."
          if [ "$IN_CTR" != "$ON_HOST" ]; then
            echo "::error::container en host lopen NU al uit elkaar -- de mount hangt aan een oude inode"
            exit 1
          fi
          echo "MOUNT_OK"

          echo
          echo "=== 3. is /intern/ nu echt afgeschermd? (nulmeting voor de terugtoets) ==="
          IP=$(docker inspect -f '{{range $k, $v := .NetworkSettings.Networks}}{{$v.IPAddress}} {{end}}' "$CTR" | awk '{print $1}')
          echo "container-ip=$IP"
          NOAUTH=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
            -H 'Host: vinomartino.com' "http://$IP/intern/" 2>/dev/null || echo 000)
          echo "GET /intern/ zonder credential -> HTTP $NOAUTH (moet 401 zijn)"
          ROOT=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
            -H 'Host: vinomartino.com' "http://$IP/" 2>/dev/null || echo 000)
          echo "GET / (controle: origin leeft)      -> HTTP $ROOT"
          if [ "$NOAUTH" != "401" ]; then
            echo "::error::/intern/ geeft $NOAUTH zonder credential -- basic-auth staat niet aan zoals verwacht"
            exit 1
          fi
          if [ "$ROOT" = "000" ]; then
            echo "::error::origin onbereikbaar op $IP -- de terugtoets zou niets meten"
            exit 1
          fi
          echo "NULMETING_OK"

          echo
          echo "=== 4. gereedschap dat apply nodig heeft ==="
          for B in openssl curl sha256sum stat docker; do
            if command -v "$B" >/dev/null 2>&1; then echo "  $B: aanwezig"; else echo "::error::$B ONTBREEKT"; fi
          done
          # openssl passwd -apr1 moet echt werken, niet alleen bestaan.
          if printf '%s' 'lat5462-probe' | openssl passwd -apr1 -stdin >/dev/null 2>&1; then
            echo "  openssl passwd -apr1: werkt"
          else
            echo "::error::openssl passwd -apr1 werkt niet -- apply kan geen hash maken"
          fi

          echo
          echo "=== 5. eerdere backups van deze rotatie ==="
          ls -la /root/vinomartino-site/htpasswd.bak-lat5462-* 2>/dev/null || echo "(geen)"
          ls -la /root/vinomartino-site/.htpasswd-marijn.cred 2>/dev/null || echo "(geen credentialbestand)"
          echo "=== DIAGNOSE KLAAR ==="
          DIAGEOF
          ssh "$VPS" "bash -s" < /tmp/lat5462-diag.sh

      # ===================================================================== apply
      # Preflight VOOR de host wordt aangeraakt. De rotatie is pas compleet als de
      # nieuwe hash ook in de repo staat (zie de kopnoot). Blijkt de push pas achteraf
      # onmogelijk, dan moet er teruggerold worden op een productiecontainer -- dat is
      # een dure manier om erachter te komen dat het token niet naar main mag.
      # Let op: dit toetst de authenticatie, niet elke branch-protection-regel; die
      # worden pas bij receive geevalueerd. Vandaar dat de rollback-stap blijft bestaan.
      - name: Preflight — mag deze run naar main pushen?
        if: inputs.mode == 'apply'
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git push --dry-run origin HEAD:main; then
            echo "PUSH_PREFLIGHT_OK"
          else
            echo "::error::deze run kan niet naar main pushen; apply afgebroken voordat de host is aangeraakt"
            exit 1
          fi

      - name: Roteer op de host + terugtoets
        id: rotate
        if: inputs.mode == 'apply'
        env:
          VPS: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          cat > /tmp/lat5462-apply.sh <<'APPLYEOF'
          set -euo pipefail
          F=/root/vinomartino-site/htpasswd
          CRED=/root/vinomartino-site/.htpasswd-marijn.cred
          CTR=paperclip-vinomartino-prod-1
          TS=$(date -u +%Y%m%dT%H%M%SZ)
          BAK="$F.bak-lat5462-$TS"

          # --- 0. precondities ------------------------------------------------
          [ -f "$F" ] || { echo "::error::$F ontbreekt"; exit 1; }
          INO_BEFORE=$(stat -c %i "$F")
          MODE_BEFORE=$(stat -c %a "$F")
          OLD_FILE_SHA=$(sha256sum "$F" | cut -d' ' -f1)
          USER_NAME=$(head -1 "$F" | cut -d: -f1)
          OLD_HASH_SHA=$(head -1 "$F" | cut -d: -f2- | tr -d '\n' | sha256sum | cut -d' ' -f1)
          LINES=$(grep -c . "$F" || true)
          echo "gebruiker=$USER_NAME regels=$LINES inode=$INO_BEFORE mode=$MODE_BEFORE"
          echo "oude bestands-sha256=${OLD_FILE_SHA:0:16}... oude hash-sha256=${OLD_HASH_SHA:0:16}..."
          [ -n "$USER_NAME" ] || { echo "::error::geen gebruikersnaam uit $F"; exit 1; }
          [ "$LINES" = "1" ] || { echo "::error::verwacht 1 regel, gevonden $LINES -- handmatig nakijken"; exit 1; }

          IP=$(docker inspect -f '{{range $k, $v := .NetworkSettings.Networks}}{{$v.IPAddress}} {{end}}' "$CTR" | awk '{print $1}')
          [ -n "$IP" ] || { echo "::error::geen container-ip voor $CTR"; exit 1; }

          # Credential gaat via stdin naar curl (--config -), niet via -u:
          # -u zet hem in de argv en dus in `ps` op deze host.
          probe() {
            if [ -z "${1:-}" ]; then
              curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
                -H 'Host: vinomartino.com' "http://$IP/intern/" 2>/dev/null || echo 000
            else
              printf 'user = "%s"\n' "$1" | curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
                -H 'Host: vinomartino.com' --config - "http://$IP/intern/" 2>/dev/null || echo 000
            fi
          }

          PRE=$(probe "")
          echo "VOOR: /intern/ zonder credential -> HTTP $PRE (moet 401)"
          [ "$PRE" = "401" ] || { echo "::error::nulmeting faalt ($PRE); niets aangeraakt"; exit 1; }

          # --- 1. backup ------------------------------------------------------
          cp "$F" "$BAK"
          chmod 600 "$BAK"
          echo "backup: $BAK (sha256 ${OLD_FILE_SHA:0:16}...)"

          # --- 2. nieuwe credential, uitsluitend in het geheugen van deze shell ---
          # Alleen alnum: houdt de curl-configregel en de $apr1$-invoer vrij van
          # quoting-verrassingen. 32 tekens uit [A-Za-z0-9] ~= 190 bits, dus de
          # zwakkere $apr1$ (MD5) is hier geen brute-force-risico. Formaat blijft
          # gelijk aan wat er nu staat; een formaatwissel is een aparte wijziging.
          PW=$(openssl rand -base64 96 | tr -dc 'A-Za-z0-9')
          PW=${PW:0:32}
          [ "${#PW}" = "32" ] || { echo "::error::wachtwoordgeneratie faalde"; exit 1; }
          HASH=$(printf '%s' "$PW" | openssl passwd -apr1 -stdin)
          case "$HASH" in
            '$apr1$'*) : ;;
            *) echo "::error::onverwacht hashformaat uit openssl"; exit 1 ;;
          esac

          # --- 3. in-place schrijven (inode moet gelijk blijven) ---------------
          printf '%s:%s\n' "$USER_NAME" "$HASH" > "$F"
          chmod "$MODE_BEFORE" "$F"
          INO_AFTER=$(stat -c %i "$F")
          echo "inode voor=$INO_BEFORE na=$INO_AFTER"
          if [ "$INO_BEFORE" != "$INO_AFTER" ]; then
            echo "::error::INODE GEWIJZIGD -- de bind-mount wijst nu naar het oude bestand; terugrollen"
            cp "$BAK" "$F"; exit 1
          fi
          NEW_FILE_SHA=$(sha256sum "$F" | cut -d' ' -f1)
          NEW_HASH_SHA=$(printf '%s' "$HASH" | sha256sum | cut -d' ' -f1)
          echo "nieuwe bestands-sha256=${NEW_FILE_SHA:0:16}... nieuwe hash-sha256=${NEW_HASH_SHA:0:16}..."
          [ "$NEW_FILE_SHA" != "$OLD_FILE_SHA" ] || { echo "::error::bestand ongewijzigd"; cp "$BAK" "$F"; exit 1; }

          # Ziet de container het echt? (de inode-check hierboven bewijst dat indirect,
          # dit bewijst het rechtstreeks aan de mount-kant.)
          CTR_SHA=$(docker exec "$CTR" sha256sum /etc/nginx/.htpasswd | cut -d' ' -f1)
          echo "container ziet ${CTR_SHA:0:16}..."
          if [ "$CTR_SHA" != "$NEW_FILE_SHA" ]; then
            echo "::error::container leest nog de oude inhoud; terugrollen"
            cp "$BAK" "$F"; exit 1
          fi

          # --- 4. nginx reload ------------------------------------------------
          rollback() {
            echo "::error::$1 -- AUTOMATISCHE ROLLBACK"
            cp "$BAK" "$F"
            docker exec "$CTR" nginx -s reload >/dev/null 2>&1 || docker restart "$CTR" >/dev/null
            sleep 3
            echo "na rollback: bestands-sha256=$(sha256sum "$F" | cut -c1-16)... inode=$(stat -c %i "$F")"
            echo "na rollback: /intern/ zonder credential -> HTTP $(probe "")"
            exit 1
          }
          docker exec "$CTR" nginx -t >/dev/null 2>&1 || rollback "nginx -t faalt na de wijziging"
          docker exec "$CTR" nginx -s reload || rollback "nginx -s reload faalde"
          sleep 2

          # --- 5. terugtoets: drie metingen, niet een ------------------------
          NEWCODE=$(probe "$USER_NAME:$PW")
          echo "NA: nieuw wachtwoord        -> HTTP $NEWCODE (mag NIET 401/000 zijn)"
          # Negatieve controle. Zonder deze zou NEWCODE ook groen zijn als auth uit stond.
          WRONG=$(probe "$USER_NAME:definitely-not-the-password-lat5462")
          echo "NA: fout wachtwoord         -> HTTP $WRONG (moet 401)"
          NOAUTH=$(probe "")
          echo "NA: zonder credential       -> HTTP $NOAUTH (moet 401)"

          [ "$NEWCODE" != "401" ] && [ "$NEWCODE" != "000" ] || rollback "nieuw wachtwoord werkt niet ($NEWCODE)"
          [ "$WRONG" = "401" ]  || rollback "negatieve controle faalt: fout wachtwoord gaf $WRONG"
          [ "$NOAUTH" = "401" ] || rollback "auth staat niet meer aan: zonder credential $NOAUTH"

          # --- 6. de waarde opbergen, root-only -------------------------------
          umask 077
          : > "$CRED"
          chmod 600 "$CRED"
          {
            printf '# LAT-5462 basic-auth vinomartino.com/intern/ -- geroteerd %s\n' "$TS"
            printf '# gebruiker: %s\n' "$USER_NAME"
            printf '%s\n' "$PW"
          } > "$CRED"
          echo "credential opgeborgen: $CRED $(stat -c 'mode=%a eigenaar=%U:%G' "$CRED")"

          # --- 7. rapport: alleen vingerafdrukken, nooit waarden ---------------
          echo "=== RAPPORT (geen waarden) ==="
          echo "gebruiker           : $USER_NAME"
          echo "wachtwoordlengte    : ${#PW}"
          echo "wachtwoord-sha256   : $(printf '%s' "$PW" | sha256sum | cut -c1-16)..."
          echo "oude hash-sha256    : ${OLD_HASH_SHA:0:16}..."
          echo "nieuwe hash-sha256  : ${NEW_HASH_SHA:0:16}..."
          echo "oud bestand sha256  : ${OLD_FILE_SHA:0:16}..."
          echo "nieuw bestand sha256: ${NEW_FILE_SHA:0:16}..."
          echo "backup              : $BAK"
          echo "APPLY_OK"
          APPLYEOF
          ssh "$VPS" "bash -s" < /tmp/lat5462-apply.sh

      # De nieuwe hash moet ook in de repo, anders zet deploy.yml stap 7 de oude
      # terug bij de eerstvolgende productie-deploy. Aparte ssh-call: de stap
      # hierboven gebruikt stdin al voor `bash -s`. Via een bestand, niet via de
      # log -- de hash reist wel, maar hoeft niet in de runoutput te staan.
      - name: Nieuwe hash ophalen en naar de repo committen
        id: commit
        if: inputs.mode == 'apply'
        env:
          VPS: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          ssh "$VPS" "cat /root/vinomartino-site/htpasswd" > htpasswd.incoming
          # Vorm valideren zonder de hash te printen.
          LINES=$(grep -c . htpasswd.incoming || true)
          [ "$LINES" = "1" ] || { echo "::error::opgehaald bestand heeft $LINES regels"; exit 1; }
          grep -qE '^[A-Za-z0-9_.-]+:\$apr1\$' htpasswd.incoming \
            || { echo "::error::opgehaalde regel heeft niet de verwachte user:\$apr1\$-vorm"; exit 1; }
          OLD=$(sha256sum htpasswd | cut -d' ' -f1)
          NEW=$(sha256sum htpasswd.incoming | cut -d' ' -f1)
          echo "repo=${OLD:0:16}... host=${NEW:0:16}..."
          if [ "$OLD" = "$NEW" ]; then
            echo "::error::repo en host zijn identiek -- de rotatie is niet doorgekomen"
            exit 1
          fi
          mv htpasswd.incoming htpasswd
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add htpasswd
          # [skip ci]: htpasswd staat NIET in de paths-ignore van deploy.yml, dus zonder
          # deze marker triggert deze commit meteen een productie-release.
          # Meerdere -m in plaats van een meerregelige string: een blokscalar in YAML
          # eindigt bij de eerste regel die minder is ingesprongen, dus een
          # commitboodschap met kolom-0-regels maakt dit bestand onparseerbaar.
          git commit \
            -m "chore(LAT-3052): roteer prod basic-auth hash [skip ci]" \
            -m "Host is al geroteerd via lat3052-htpasswd-rotate.yml (mode=apply); deze commit houdt de repo gelijk aan de host. Zonder deze commit zet deploy.yml stap 7 (CONFIG_FILES-sync) de oude hash bij de eerstvolgende deploy terug." \
            -m "Goedgekeurd op kaart 8cf529bf; route op kaart 933eff00." \
            -m "Co-Authored-By: Paperclip <noreply@paperclip.ing>"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "gepusht: $(git rev-parse HEAD)"

      # Repo en host mogen niet uit elkaar lopen. Lukt de commit niet, dan wordt de
      # host teruggezet naar de backup van deze run -- anders staat er een rotatie op
      # de host die de volgende deploy stilzwijgend ongedaan maakt.
      - name: Rollback als de commit niet is gelukt
        if: inputs.mode == 'apply' && failure() && steps.rotate.outcome == 'success'
        env:
          VPS: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          cat > /tmp/lat5462-rb.sh <<'RBEOF'
          set -uo pipefail
          F=/root/vinomartino-site/htpasswd
          CTR=paperclip-vinomartino-prod-1
          BAK=$(ls -1t "$F".bak-lat5462-* 2>/dev/null | head -1)
          [ -n "$BAK" ] || { echo "::error::geen backup gevonden; host blijft geroteerd"; exit 1; }
          echo "terugzetten uit $BAK"
          cp "$BAK" "$F"
          rm -f /root/vinomartino-site/.htpasswd-marijn.cred
          docker exec "$CTR" nginx -s reload || docker restart "$CTR"
          sleep 3
          echo "hersteld: sha256=$(sha256sum "$F" | cut -c1-16)... inode=$(stat -c %i "$F")"
          RBEOF
          ssh "$VPS" "bash -s" < /tmp/lat5462-rb.sh

      # ==================================================================== verify
      # Herhaalbare terugtoets zonder te roteren. Bestaat omdat `apply` op /intern/
      # een 403 opleverde: dat is GEEN mislukking maar het bewijs zelf -- nginx doet
      # auth_basic in de access-fase en try_files/autoindex pas in de content-fase,
      # dus een 403 is alleen bereikbaar NA geslaagde authenticatie. /intern/ is een
      # map zonder index (er bestaat alleen src/pages/intern/dashboard.astro), dus
      # `autoindex off` geeft daar 403. Deze mode maakt dat expliciet door ook de
      # echte pagina /intern/dashboard/ op te vragen, die wel 200 hoort te geven.
      - name: Verify (leest de opgeborgen credential, roteert niets)
        if: inputs.mode == 'verify'
        env:
          VPS: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          cat > /tmp/lat5462-verify.sh <<'VEREOF'
          set -euo pipefail
          F=/root/vinomartino-site/htpasswd
          CRED=/root/vinomartino-site/.htpasswd-marijn.cred
          CTR=paperclip-vinomartino-prod-1
          [ -f "$CRED" ] || { echo "::error::$CRED ontbreekt -- is er wel geroteerd?"; exit 1; }
          USER_NAME=$(head -1 "$F" | cut -d: -f1)
          # Laatste niet-commentaarregel is de waarde. Nooit echoen.
          PW=$(grep -v '^#' "$CRED" | grep -v '^$' | tail -1)
          [ -n "$PW" ] || { echo "::error::lege credential"; exit 1; }
          IP=$(docker inspect -f '{{range $k, $v := .NetworkSettings.Networks}}{{$v.IPAddress}} {{end}}' "$CTR" | awk '{print $1}')

          probe() { # $1 = pad, $2 = credential (leeg = geen)
            if [ -z "${2:-}" ]; then
              curl -s -o /dev/null -w '%{http_code}' --max-time 10 -H 'Host: vinomartino.com' "http://$IP$1" 2>/dev/null || echo 000
            else
              printf 'user = "%s"\n' "$2" | curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
                -H 'Host: vinomartino.com' --config - "http://$IP$1" 2>/dev/null || echo 000
            fi
          }

          echo "=== terugtoets op de LEVENDE prod-container ==="
          D_NONE=$(probe /intern/dashboard/ "")
          D_WRONG=$(probe /intern/dashboard/ "$USER_NAME:definitely-not-the-password-lat5462")
          D_NEW=$(probe /intern/dashboard/ "$USER_NAME:$PW")
          I_NEW=$(probe /intern/ "$USER_NAME:$PW")
          echo "/intern/dashboard/  geen credential -> HTTP $D_NONE  (moet 401)"
          echo "/intern/dashboard/  fout wachtwoord -> HTTP $D_WRONG (moet 401)"
          echo "/intern/dashboard/  NIEUW wachtwoord-> HTTP $D_NEW   (moet 200)"
          echo "/intern/            NIEUW wachtwoord-> HTTP $I_NEW   (403 = map zonder index, post-auth)"
          echo "opgeborgen wachtwoord: lengte=${#PW} sha256=$(printf '%s' "$PW" | sha256sum | cut -c1-16)..."
          echo "live hash-sha256     : $(head -1 "$F" | cut -d: -f2- | tr -d '\n' | sha256sum | cut -c1-16)..."

          RC=0
          [ "$D_NONE"  = "401" ] || { echo "::error::geen credential gaf $D_NONE"; RC=1; }
          [ "$D_WRONG" = "401" ] || { echo "::error::fout wachtwoord gaf $D_WRONG"; RC=1; }
          [ "$D_NEW"   = "200" ] || { echo "::error::nieuw wachtwoord gaf $D_NEW"; RC=1; }
          [ "$RC" = "0" ] && echo "VERIFY_OK" || exit 1
          VEREOF
          ssh "$VPS" "bash -s" < /tmp/lat5462-verify.sh

      # ================================================================== rollback
      - name: Rollback (handmatig)
        if: inputs.mode == 'rollback'
        env:
          VPS: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          cat > /tmp/lat5462-rb-manual.sh <<'RBMEOF'
          set -uo pipefail
          F=/root/vinomartino-site/htpasswd
          CTR=paperclip-vinomartino-prod-1
          BAK=$(ls -1t "$F".bak-lat5462-* 2>/dev/null | head -1)
          [ -n "$BAK" ] || { echo "::error::geen backup van deze workflow gevonden"; exit 1; }
          INO_BEFORE=$(stat -c %i "$F")
          echo "terugzetten uit $BAK (sha256 $(sha256sum "$BAK" | cut -c1-16)...)"
          cp "$BAK" "$F"
          INO_AFTER=$(stat -c %i "$F")
          echo "inode voor=$INO_BEFORE na=$INO_AFTER"
          [ "$INO_BEFORE" = "$INO_AFTER" ] || { echo "::error::inode gewijzigd bij rollback"; exit 1; }
          rm -f /root/vinomartino-site/.htpasswd-marijn.cred
          docker exec "$CTR" nginx -t && docker exec "$CTR" nginx -s reload
          sleep 2
          IP=$(docker inspect -f '{{range $k, $v := .NetworkSettings.Networks}}{{$v.IPAddress}} {{end}}' "$CTR" | awk '{print $1}')
          echo "/intern/ zonder credential -> HTTP $(curl -s -o /dev/null -w '%{http_code}' --max-time 10 -H 'Host: vinomartino.com' "http://$IP/intern/")"
          echo "hersteld: sha256=$(sha256sum "$F" | cut -c1-16)..."
          echo "LET OP: de repo-versie van htpasswd is hiermee NIET teruggezet."
          RBMEOF
          ssh "$VPS" "bash -s" < /tmp/lat5462-rb-manual.sh
