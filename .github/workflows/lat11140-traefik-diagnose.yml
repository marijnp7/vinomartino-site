# LAT-11140 — read-only diagnose van de Cloudflare->origin-leg voor vinomartino.com
#
# Aanleiding: prod geeft 522/526 op de edge terwijl de origin (paperclip-vinomartino-prod-1)
# rechtstreeks op container-IP gewoon 200 geeft (zie LAT-11140). Verdachte is traefik
# (de gedeelde reverse-proxy / TLS-terminator) of zijn ACME-store. Geen bestaande workflow
# raakt traefik of de ACME-store aan, vandaar dit nieuwe bestand.
#
# ROUTE. Zelfde GHA->VPS SSH-kanaal als lat3052/lat3214/lat5145 (kaart 933eff00), dezelfde
# ssh-config-snippet en dezelfde secrets (VPS_SSH_PRIVATE_KEY/VPS_HOST/VPS_USER). Deze
# workflow zelf gaat via de Marijn-gate voor de merge (R2, punt 1: elk workflow-bestand),
# niet omdat de actie erin risicovol is.
#
# ALLEEN LEZEN (oorspronkelijk). Er was precies één mode: diagnose. Zie de UPDATE hieronder
# voor de modes die er sindsdien bij kwamen -- `restart` is de enige schrijfactie in dit
# bestand, expliciet als zodanig benoemd.
#
# SECRET-HYGIENE. acme.json bevat naast het certificaat ook de private key. Dit script
# decodeert en toont uitsluitend het `Certificate`-veld via `openssl x509`; het `Key`-veld
# wordt nooit gelezen, gedecodeerd of geprint.
#
# UPDATE (zelfde dag). `diagnose` liep: traefik draait sinds 2026-07-24 zonder restart,
# routing-labels kloppen, maar ACME-renewal voor vinomartino.com faalt AL DAGELIJKS sinds
# minstens 2026-09-01 met exact dezelfde 522 op de HTTP-01-challenge (dus dit is geen
# nieuw probleem van vandaag). Beslissender: een TLS-handshake op 127.0.0.1:443 **op de
# VPS zelf** kreeg geen certificaat terug -- dat is origin-side, los van Cloudflare. Twee
# nieuwe modes:
#   - diagnose2 (alleen lezen)  : NetworkMode, poort-bindings, luisterende sockets (ss),
#     de traefik-compose (entrypoint-config) en een lokale poort-80-check, om vast te
#     stellen OF en WAAROM traefik niet luistert.
#   - restart (schrijft)        : herstart alleen de traefik-container (geen ACME-force,
#     geen configwijziging) en toetst daarna terug, zowel lokaal (SSH) als van buitenaf
#     via de GHA-runner zelf (normale egress, dus een echte "bezoeker"-meting -- dat is
#     de externe fetch die LAT-11140 stap 3 vraagt). Blijft in dezelfde Marijn-gate
#     -- workflow-bestand -- maar `restart` is de eerste échte productie-runtime-actie
#     in dit bestand en dus expliciet als aparte, herkenbare stap benoemd in de PR/kaart.
#
# UPDATE 2 (zelfde dag, na diagnose2). `diagnose2` liet zien: traefik's `web`-entrypoint
# (poort 80) luistert unscoped op `:80` (alle interfaces) en antwoordt lokaal prima. Het
# `websecure`-entrypoint (poort 443) is daarentegen HARDCODED gebonden aan één specifiek
# IP-adres in de compose-command (`--entrypoints.websecure.address=<IP>:443`) -- en die
# waarde matcht exact een van onze workflow-secrets (GitHub maskeert hem automatisch in
# de run-log). `restart` alleen lost dit niet op: dat herstart hetzelfde proces met
# dezelfde, mogelijk verouderde, command-line -- het compose-bestand wordt niet herlezen.
# Twee nieuwe modes:
#   - diagnose3 (alleen lezen)  : vergelijkt het gebonden IP met het huidige publieke
#     IPv4-adres en met de lokale interface-adressen, ZONDER de waarde zelf te printen
#     (alleen MATCH/MISMATCH) -- bevestigt of het inderdaad een verouderd/vreemd adres is.
#   - fix (schrijft)            : herschrijft alleen de `--entrypoints.websecure.address=`
#     regel in het compose-bestand naar `:443` (unscoped, zelfde patroon als `web`/poort
#     80), maakt een backup, en herstart traefik via `docker compose up -d` zodat de
#     nieuwe command-line ook echt geladen wordt. Bij falen: backup terugzetten +
#     `docker compose up -d` opnieuw. Raakt geen ACME-store, geen andere container.

name: LAT-11140 traefik/ACME diagnose (vinomartino)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'diagnose/diagnose2 = alleen lezen; restart = herstart traefik (schrijft); diagnose3 = vergelijk gebonden IP met huidig publiek IP (alleen lezen); fix = herschrijf websecure-bind naar :443 + herstart (schrijft)'
        required: true
        default: diagnose
        type: choice
        options:
          - diagnose
          - diagnose2
          - restart
          - diagnose3
          - fix

concurrency:
  group: lat11140-traefik-diagnose
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # Runner-side: dit draait op een normale GHA-runner met gewone egress -- dus
      # letterlijk hoe een bezoeker vinomartino.com ziet, via de echte Cloudflare-route.
      # Geen SSH nodig. Draait bij elke mode, zodat elke run een voor/na-referentiepunt heeft.
      - name: Externe check (zoals een bezoeker, via de runner's eigen egress)
        run: |
          set -uo pipefail
          for path in / /build-info.json; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "https://vinomartino.com$path" 2>&1 || echo 000)
            echo "https://vinomartino.com$path -> HTTP $CODE"
          done

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          cat >> ~/.ssh/config <<EOF
          Host $VPS_HOST
            StrictHostKeyChecking accept-new
            UserKnownHostsFile ~/.ssh/known_hosts
          EOF
          cat "$GITHUB_WORKSPACE/ops/ssh-config-snippet" >> ~/.ssh/config
          ssh-keyscan "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      # =================================================================== diagnose
      - name: Diagnose (read-only)
        if: inputs.mode == 'diagnose'
        env:
          VPS: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          # Volledig gequote heredoc: niets uit `inputs` bereikt een commando.
          cat > /tmp/lat11140-diag.sh <<'DIAGEOF'
          set -uo pipefail
          CTR=traefik-traefik-1
          DOMAIN=vinomartino.com

          echo "=== 0. gereedschap ==="
          for B in docker openssl curl jq; do
            command -v "$B" >/dev/null 2>&1 && echo "  $B: aanwezig" || echo "  $B: ONTBREEKT"
          done

          echo
          echo "=== 1. leeft de container, en sinds wanneer ==="
          docker inspect -f 'status={{.State.Status}} gestart={{.State.StartedAt}} restarts={{.RestartCount}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}(geen healthcheck){{end}}' "$CTR" 2>&1 || echo "::error::container $CTR niet gevonden"

          echo
          echo "=== 2. mounts (ACME-store, config) ==="
          docker inspect -f '{{range .Mounts}}{{.Source}} -> {{.Destination}} rw={{.RW}}{{println}}{{end}}' "$CTR" 2>&1

          echo
          echo "=== 3. poorten ==="
          docker inspect -f '{{range $p, $b := .NetworkSettings.Ports}}{{$p}} -> {{$b}}{{println}}{{end}}' "$CTR" 2>&1

          echo
          echo "=== 4. laatste 200 regels traefik-log, plus gefilterd op error/warn/acme/certificate/tls ==="
          docker logs "$CTR" --tail 200 2>&1 | tail -200
          echo "--- gefilterd (laatste 2000 regels doorzocht) ---"
          docker logs "$CTR" --tail 2000 2>&1 | grep -iE 'error|warn|acme|certificate|tls' | tail -80 || echo "(geen matches)"

          echo
          echo "=== 5. ACME-store: welk certificaat heeft traefik voor $DOMAIN? (nooit het Key-veld) ==="
          ACMEFILE=$(docker exec "$CTR" sh -c 'find / -xdev -maxdepth 5 -iname "acme.json" 2>/dev/null | head -1' 2>&1 || true)
          echo "acme.json-pad in container: ${ACMEFILE:-(niet gevonden)}"
          if [ -n "${ACMEFILE:-}" ] && [[ "$ACMEFILE" == /* ]]; then
            docker exec "$CTR" sh -c "cat '$ACMEFILE'" 2>/dev/null > /tmp/acme.json || echo "::warning::kon acme.json niet lezen"
            if [ -s /tmp/acme.json ]; then
              echo "acme.json grootte: $(wc -c < /tmp/acme.json) bytes"
              echo "resolvers in acme.json: $(jq -r 'keys | join(\", \")' /tmp/acme.json 2>&1)"
              CERT_B64=$(jq -r --arg d "$DOMAIN" '
                [.. | objects | select(has("Certificates") or has("certificates"))
                 | (.Certificates // .certificates // [])[]]
                | map(select(((.Domain.Main // .domain.main // "") | ascii_downcase) == ($d | ascii_downcase)))
                | .[0] | (.Certificate // .certificate) // empty
              ' /tmp/acme.json 2>/dev/null || true)
              if [ -n "$CERT_B64" ]; then
                echo "$CERT_B64" | base64 -d > /tmp/cert.der 2>/dev/null || echo "::warning::base64-decode van certificaat faalde"
                if [ -s /tmp/cert.der ]; then
                  echo "--- certificaat dat traefik voor $DOMAIN heeft opgeslagen ---"
                  openssl x509 -inform der -in /tmp/cert.der -noout -subject -issuer -dates 2>&1 || \
                    openssl x509 -in /tmp/cert.der -noout -subject -issuer -dates 2>&1
                fi
              else
                echo "::warning::geen Certificates-entry voor $DOMAIN gevonden in acme.json"
              fi
              rm -f /tmp/acme.json /tmp/cert.der
            fi
          else
            echo "::warning::geen acme.json op de gebruikelijke plek gevonden -- mogelijk ander cert-mechanisme of andere ACME-store-locatie"
          fi

          echo
          echo "=== 6. traefik-labels van routers/services (dynamische config, alle containers) ==="
          for c in $(docker ps --format '{{.Names}}'); do
            LABELS=$(docker inspect -f '{{range $k, $v := .Config.Labels}}{{$k}}={{$v}}{{println}}{{end}}' "$c" 2>/dev/null | grep -i traefik || true)
            if [ -n "$LABELS" ]; then
              echo "--- $c ---"
              echo "$LABELS"
            fi
          done

          echo
          echo "=== 7. directe TLS-handshake op de host zoals Cloudflare hem ziet (SNI=$DOMAIN, poort 443) ==="
          PUBIP=$(curl -s --max-time 5 https://ifconfig.me 2>/dev/null || echo "")
          echo "host-publieke-ip (self-report): ${PUBIP:-onbekend}"
          echo "--- handshake via 127.0.0.1:443 ---"
          timeout 10 openssl s_client -connect 127.0.0.1:443 -servername "$DOMAIN" -showcerts </dev/null 2>&1 \
            | awk '/BEGIN CERTIFICATE/{c++} c==1' > /tmp/edge-local.pem || true
          if [ -s /tmp/edge-local.pem ]; then
            openssl x509 -in /tmp/edge-local.pem -noout -subject -issuer -dates 2>&1
          else
            echo "::error::handshake op 127.0.0.1:443 leverde geen certificaat op (connect-fout of timeout)"
          fi
          rm -f /tmp/edge-local.pem
          if [ -n "${PUBIP:-}" ]; then
            echo "--- handshake via publiek IP $PUBIP:443 ---"
            timeout 10 openssl s_client -connect "$PUBIP:443" -servername "$DOMAIN" -showcerts </dev/null 2>&1 \
              | awk '/BEGIN CERTIFICATE/{c++} c==1' > /tmp/edge-pub.pem || true
            if [ -s /tmp/edge-pub.pem ]; then
              openssl x509 -in /tmp/edge-pub.pem -noout -subject -issuer -dates 2>&1
            else
              echo "::error::handshake op $PUBIP:443 leverde geen certificaat op (connect-fout of timeout)"
            fi
            rm -f /tmp/edge-pub.pem
          fi

          echo
          echo "=== 8. bereikt traefik de vinomartino-prod-container intern? ==="
          docker exec "$CTR" sh -c 'wget -qO- --timeout=5 http://paperclip-vinomartino-prod-1/ 2>&1 | head -c 200; echo' 2>&1 || \
            echo "::warning::wget vanuit traefik naar paperclip-vinomartino-prod-1 faalde of ontbreekt in de image"

          echo
          echo "=== DIAGNOSE KLAAR ==="
          DIAGEOF
          ssh "$VPS" "bash -s" < /tmp/lat11140-diag.sh

      # ================================================================== diagnose2
      - name: Diagnose2 - netwerk/poorten (read-only)
        if: inputs.mode == 'diagnose2'
        env:
          VPS: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          cat > /tmp/lat11140-diag2.sh <<'DIAG2EOF'
          set -uo pipefail
          CTR=traefik-traefik-1

          echo "=== a. NetworkMode + poort-bindings (ruw) ==="
          docker inspect -f 'NetworkMode={{.HostConfig.NetworkMode}}' "$CTR" 2>&1
          echo "PortBindings:"
          docker inspect -f '{{json .HostConfig.PortBindings}}' "$CTR" 2>&1
          echo "Networks:"
          docker inspect -f '{{range $k, $v := .NetworkSettings.Networks}}{{$k}} ip={{$v.IPAddress}}{{println}}{{end}}' "$CTR" 2>&1

          echo
          echo "=== b. luistert er iets op 80/443 op de host? ==="
          if command -v ss >/dev/null 2>&1; then
            ss -tlnp 2>&1 | (grep -E ':(80|443)\b' || echo "(niets gevonden op 80/443)")
          else
            netstat -tlnp 2>&1 | (grep -E ':(80|443)\b' || echo "(niets gevonden op 80/443, netstat)")
          fi

          echo
          echo "=== c. wat draait er in de container (entrypoint-flags zichtbaar in argv)? ==="
          docker top "$CTR" -o pid,cmd 2>&1

          echo
          echo "=== d. traefik-compose (entrypoint/poort-config, geen secrets verwacht) ==="
          CF=$(docker inspect -f '{{index .Config.Labels "com.docker.compose.project.config_files"}}' "$CTR" 2>/dev/null || true)
          echo "config_files label: ${CF:-(geen)}"
          if [ -n "${CF:-}" ] && [ -f "$CF" ]; then
            cat "$CF"
          else
            echo "::warning::compose-bestand niet op het verwachte pad gevonden"
          fi

          echo
          echo "=== e. lokale poort-80-check (HTTP-01-challenge-pad, geen TLS) ==="
          curl -s -o /dev/null -w 'lokaal poort 80 (Host: vinomartino.com) -> HTTP %{http_code}\n' --max-time 5 \
            -H 'Host: vinomartino.com' http://127.0.0.1/.well-known/acme-challenge/lat11140-probe 2>&1 || \
            echo "lokaal poort 80 -> geen verbinding (connect-fout of timeout)"

          echo
          echo "=== DIAGNOSE2 KLAAR ==="
          DIAG2EOF
          ssh "$VPS" "bash -s" < /tmp/lat11140-diag2.sh

      # ======================================================================= restart
      # De enige schrijfactie in dit bestand: herstart alleen traefik-traefik-1 (geen
      # ACME-force, geen configwijziging, geen aanraken van andere containers). Volledig
      # reversibel -- een restart die niet helpt laat de storing in dezelfde staat.
      - name: Restart traefik + terugtoets
        if: inputs.mode == 'restart'
        env:
          VPS: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          cat > /tmp/lat11140-restart.sh <<'RESTARTEOF'
          set -uo pipefail
          CTR=traefik-traefik-1

          echo "=== voor de herstart ==="
          docker inspect -f 'status={{.State.Status}} gestart={{.State.StartedAt}} restarts={{.RestartCount}}' "$CTR" 2>&1

          echo
          echo "=== docker restart $CTR ==="
          docker restart "$CTR"
          sleep 8
          docker inspect -f 'status={{.State.Status}} gestart={{.State.StartedAt}} restarts={{.RestartCount}}' "$CTR" 2>&1

          echo
          echo "=== lokale terugtoets: TLS-handshake op 127.0.0.1:443 (SNI=vinomartino.com) ==="
          timeout 10 openssl s_client -connect 127.0.0.1:443 -servername vinomartino.com -showcerts </dev/null 2>&1 \
            | awk '/BEGIN CERTIFICATE/{c++} c==1' > /tmp/edge-restart.pem || true
          if [ -s /tmp/edge-restart.pem ]; then
            openssl x509 -in /tmp/edge-restart.pem -noout -subject -issuer -dates 2>&1
          else
            echo "::error::handshake op 127.0.0.1:443 leverde nog steeds geen certificaat op"
          fi
          rm -f /tmp/edge-restart.pem

          echo
          echo "=== recente traefik-logs na herstart ==="
          sleep 5
          docker logs "$CTR" --tail 60 2>&1
          echo "=== RESTART KLAAR ==="
          RESTARTEOF
          ssh "$VPS" "bash -s" < /tmp/lat11140-restart.sh

      - name: Externe terugtoets na restart (runner-egress)
        if: inputs.mode == 'restart'
        run: |
          set -uo pipefail
          sleep 5
          for path in / /build-info.json; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "https://vinomartino.com$path" 2>&1 || echo 000)
            echo "NA restart: https://vinomartino.com$path -> HTTP $CODE"
          done

      # ================================================================= diagnose3
      - name: Diagnose3 - is het gebonden IP verouderd? (read-only, print geen waarden)
        if: inputs.mode == 'diagnose3'
        env:
          VPS: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          cat > /tmp/lat11140-diag3.sh <<'DIAG3EOF'
          set -uo pipefail
          CTR=traefik-traefik-1

          # Gebonden IP uit de eigen command-line halen, nooit apart printen.
          BOUND=$(docker inspect -f '{{json .Args}}' "$CTR" 2>/dev/null \
            | tr ',' '\n' | grep -o 'entrypoints.websecure.address=[^"]*' \
            | sed 's/.*address=//; s/:443$//')
          if [ -z "${BOUND:-}" ]; then
            echo "::error::kon het gebonden websecure-IP niet uit de command-line halen"
            exit 1
          fi

          CURRENT4=$(curl -4 -s --max-time 5 https://ifconfig.me 2>/dev/null || echo "")
          echo "huidig publiek IPv4 (via ifconfig.me -4): ${CURRENT4:-onbekend}"

          echo
          if [ -n "${CURRENT4:-}" ] && [ "$BOUND" = "$CURRENT4" ]; then
            echo "VERDICT: MATCH -- het gebonden websecure-IP is het huidige publieke IPv4-adres"
          else
            echo "VERDICT: MISMATCH -- het gebonden websecure-IP is NIET het huidige publieke IPv4-adres"
          fi

          echo
          echo "=== is het gebonden IP uberhaupt een lokaal interface-adres? ==="
          if ip -4 addr show scope global 2>/dev/null | grep -qF "$BOUND"; then
            echo "gebonden IP staat op een lokale interface (nog steeds geldig als lokaal adres)"
          else
            echo "gebonden IP staat op GEEN ENKELE lokale interface -- dit adres bestaat hier niet (meer)"
          fi

          echo
          echo "=== ter vergelijking: alle huidige lokale IPv4-adressen (geen secrets) ==="
          ip -4 addr show scope global 2>&1 | grep -oP '(?<=inet\s)\d+(\.\d+){3}' || echo "(geen)"

          echo
          echo "=== DIAGNOSE3 KLAAR ==="
          DIAG3EOF
          ssh "$VPS" "bash -s" < /tmp/lat11140-diag3.sh

      # ======================================================================== fix
      # De tweede schrijfactie in dit bestand: herschrijft ALLEEN de
      # `--entrypoints.websecure.address=` regel naar `:443` (unscoped, zelfde patroon
      # als de al werkende `web`-entrypoint op poort 80). Maakt eerst een backup. Raakt
      # geen ACME-store, geen andere regel, geen andere container.
      - name: Fix - websecure-bind naar :443 + herstart
        if: inputs.mode == 'fix'
        env:
          VPS: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          cat > /tmp/lat11140-fix.sh <<'FIXEOF'
          set -euo pipefail
          CTR=traefik-traefik-1
          CF=/docker/traefik/docker-compose.yml
          TS=$(date -u +%Y%m%dT%H%M%SZ)
          BAK="$CF.bak-lat11140-$TS"

          [ -f "$CF" ] || { echo "::error::$CF ontbreekt"; exit 1; }
          cp "$CF" "$BAK"
          chmod 644 "$BAK"
          echo "backup: $BAK"

          if ! grep -q 'entrypoints\.websecure\.address=' "$CF"; then
            echo "::error::geen entrypoints.websecure.address-regel gevonden in $CF -- niets gewijzigd"
            exit 1
          fi

          sed -i -E 's/^([[:space:]]*-[[:space:]]*--entrypoints\.websecure\.address=).*/\1:443/' "$CF"

          echo "--- regel na wijziging ---"
          grep 'entrypoints\.websecure\.address=' "$CF"

          cd /docker/traefik
          echo
          echo "=== docker compose up -d (herlaadt command-line uit het bestand) ==="
          if docker compose version >/dev/null 2>&1; then
            docker compose up -d
          else
            docker-compose up -d
          fi
          sleep 8
          docker inspect -f 'status={{.State.Status}} gestart={{.State.StartedAt}} restarts={{.RestartCount}}' "$CTR" 2>&1

          echo
          echo "=== lokale terugtoets: TLS-handshake op 127.0.0.1:443 (SNI=vinomartino.com) ==="
          timeout 10 openssl s_client -connect 127.0.0.1:443 -servername vinomartino.com -showcerts </dev/null 2>&1 \
            | awk '/BEGIN CERTIFICATE/{c++} c==1' > /tmp/edge-fix.pem || true
          if [ -s /tmp/edge-fix.pem ]; then
            echo "SUCCES: certificaat ontvangen op 127.0.0.1:443"
            openssl x509 -in /tmp/edge-fix.pem -noout -subject -issuer -dates 2>&1
          else
            echo "::error::handshake op 127.0.0.1:443 leverde nog steeds geen certificaat op -- terugrollen"
            cp "$BAK" "$CF"
            docker compose up -d 2>/dev/null || docker-compose up -d
            echo "teruggerold naar $BAK"
            exit 1
          fi
          rm -f /tmp/edge-fix.pem

          echo
          echo "=== recente traefik-logs na fix ==="
          sleep 5
          docker logs "$CTR" --tail 60 2>&1
          echo "=== FIX KLAAR (backup: $BAK) ==="
          FIXEOF
          ssh "$VPS" "bash -s" < /tmp/lat11140-fix.sh

      - name: Externe terugtoets na fix (runner-egress)
        if: inputs.mode == 'fix'
        run: |
          set -uo pipefail
          sleep 5
          for path in / /build-info.json; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "https://vinomartino.com$path" 2>&1 || echo 000)
            echo "NA fix: https://vinomartino.com$path -> HTTP $CODE"
          done
