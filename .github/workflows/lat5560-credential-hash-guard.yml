# LAT-5560 — blokkeer een crypt-wachtwoordhash in de repo.
#
# `htpasswd` (de $apr1$-hash van vinomartino.com/intern/) stond op rootniveau in deze
# repo en werd door deploy.yml stap 7 en publish.yml naar de VPS gekopieerd. Hij is
# verwijderd; de host is nu de bron van waarheid. Deze workflow is wat voorkomt dat hij
# terugsluipt — zonder guard gebeurt dat stil, en dan legt de eerstvolgende rotatie de
# hash opnieuw permanent vast in de historie.
#
# DE ZELFTEST IS NIET OPTIONEEL. Een groene guard-run bewijst uit zichzelf niets: een
# detector die niets meet is óók groen. Stap 1 plant daarom canaries en eist dat de
# guard daar ROOD op gaat; pas daarna telt stap 2 mee. Dat is geen theorie — bij het
# schrijven van deze guard stond het hash-patroon door een ERE-ankerfout permanent
# groen, en de zelftest is wat dat aan het licht bracht.
#
# Draait op push en PR: een guard die alleen op PR draait, mist elke directe push
# naar main — en dat is precies hoe de rotatie-workflow committeerde.

name: LAT-5560 credential-hash guard

on:
  push:
    branches: [main, preview]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lat5560-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Rode tegenproef eerst: bewijst dat de guard op een echte hash rood gaat
      # én dat hij niet op een willekeurig bestand vals alarm slaat.
      - name: Zelftest (guard moet rood kunnen)
        run: ./scripts/lat5560-no-credential-hash-in-repo.sh --self-test

      - name: Scan getrackte bestanden
        run: ./scripts/lat5560-no-credential-hash-in-repo.sh
