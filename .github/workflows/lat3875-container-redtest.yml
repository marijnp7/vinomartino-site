# LAT-3875 — container-level rode tegenproef voor de capability-probe `/health`.
#
# Waarom dit bestaat: LAT-3875 vraagt niet om "het endpoint geeft 503", maar om
# "de CONTAINER wordt daadwerkelijk `unhealthy`". Dat verdict is `.State.Health.Status`
# van Docker zelf en is voor geen enkele agent leesbaar — de scoped broker geeft 403 op
# /containers/<naam>/json. Dit draait daarom over hetzelfde GHA->VPS SSH-kanaal als
# LAT-4750 (route goedgekeurd onder kaart 933eff00).
#
# Alleen-lezen op productie. De drie testcontainers draaien met --rm op een eigen naam en
# raken paperclip-publish-dispatcher-1 niet aan.
#
# Geen enkele input wordt in een commando geinterpoleerd; het script is vast.
#
# LET OP bij pushen: elk bestand onder .github/ op main triggert normaal een
# productie-release (deploy.yml heeft .github/** niet in paths-ignore). Pushen met
# "[skip ci]".
#
# ---------------------------------------------------------------------------
# LAT-5276 — BESLUIT over het expiry-verdict (CTO, 2026-08-13)
#
# Vraag: wat doet een token dat NU werkt maar binnenkort verloopt met het
# health-verdict? LAT-3875 vroeg "degraded onder 14 dagen"; letterlijk uitgevoerd
# zet dat een volledig werkend token 14 dagen lang op `unhealthy`.
#
# Besluit: NIET letterlijk. Expiry is een eigen as met TWEE drempels, en die
# staan al in `src/index.js` (HEALTH_EXPIRY_WARN_DAYS=14, HEALTH_EXPIRY_FAIL_DAYS=2):
#
#   resterend   state      ok     HTTP  container   wie handelt
#   ---------   --------   -----  ----  ---------   -------------------------------
#   > 14d       ok         true   200   healthy     niemand
#   <= 14d      ok         true   200   healthy     mens, via het LAT-3858-alarm
#   <= 2d       degraded   false  503   unhealthy   mens: nu roteren
#   verlopen    down       false  503   unhealthy   mens: incident (401-as)
#
# LET OP: het veld `warn` in de /health-body heeft GEEN lezer. Het 14-daagse alarm van
# LAT-3858 meet het token rechtstreeks (curl op /user, expiration-header, over de env- en
# de bestand-kant) en pollt /health niet. Dat is bewust beter — dat alarm werkt ook als de
# dispatcher plat ligt — maar het betekent dat `warn` diagnostisch is en geen alarm-as.
# Bouw er geen tweede alarm op zonder eerst LAT-3858's dekking voor DEZE token te meten:
# twee alarmen op een klasse ontdubbelen op elkaar en zetten er een van stil.
#
# Waarom een WARN-tier die groen blijft: 14 dagen rood traint iedereen om het rood
# te negeren, en dan wordt `unhealthy` genegeerd wanneer hij wel telt.
# Waarom een FAIL-tier toch bestaat: op <= 2 dagen is de storing niet meer
# hypothetisch maar ingepland, en heeft de warn-tier al 12 dagen geroepen.
# `unhealthy` is daar geen zelf-veroorzaakte storing maar het laatste signaal
# voor een onvermijdelijke.
#
# Het GEDRAG was dus al af; wat ontbrak was de tegenproef. Case 3b raakte alleen
# de warn-tier en liet het verdict expliciet ongemoeid, en de FAIL-tier werd door
# geen enkele case aangeraakt — precies de fout die LAT-3875 zelf aanklaagt: een
# drempel die niet rood KAN worden. Case 3b toetst nu ook het verdict (groen
# blijven IS het besluit) en case 3c isoleert de FAIL-tier.
# ---------------------------------------------------------------------------

name: LAT-3875 container redtest publish-dispatcher

on:
  workflow_dispatch:

concurrency:
  group: lat3875-container-redtest
  cancel-in-progress: false

jobs:
  redtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          cat >> ~/.ssh/config <<EOF
          Host $VPS_HOST
            StrictHostKeyChecking accept-new
            UserKnownHostsFile ~/.ssh/known_hosts
          EOF
          cat "$GITHUB_WORKSPACE/ops/ssh-config-snippet" >> ~/.ssh/config
          ssh-keyscan "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Container-level rode tegenproef
        env:
          VPS: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          SCRIPT: |
            set -uo pipefail

            LIVE=paperclip-publish-dispatcher-1
            FAILED=0

            # ---------------------------------------------------------------- 0. binding
            # De proef moet gaan over het image dat productie NU draait, niet over een
            # image dat ooit gebouwd is. Daarom het image-id uit de levende container.
            IMG=$(docker inspect -f '{{.Image}}' "$LIVE") || { echo "::error::$LIVE niet gevonden"; exit 1; }
            echo "=== 0. BINDING AAN LIVE ==="
            echo "live container image id : $IMG"
            docker inspect -f 'latest_tag={{.Id}}' paperclip-publish-dispatcher:latest || true
            echo "live health status      : $(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}GEEN-HEALTHCHECK{{end}}' "$LIVE")"
            echo "live healthcheck config : $(docker inspect -f '{{json .Config.Healthcheck}}' "$LIVE")"
            echo
            echo "Als hierboven GEEN-HEALTHCHECK staat kan de container per definitie niet"
            echo "unhealthy worden en is de rest van deze run zinloos."

            # ------------------------------------------------- 0b. wie handelt op unhealthy?
            # LAT-5276 leunt op de aanname dat `unhealthy` een SIGNAAL is en geen ACTIE. Klopt
            # die niet — herstart iets de container, of trekt iets verkeer weg — dan is de
            # FAIL-tier op 2 dagen een zelf-veroorzaakte storing en moet HEALTH_EXPIRY_FAIL_DAYS
            # naar 0 (alleen de echte 401 nog rood). Daarom hier gemeten, niet geredeneerd.
            # Alleen-lezen, en met smalle --format: een kale `docker inspect` dumpt .Config.Env.
            echo
            echo "=== 0b. CONSUMENTEN VAN HET HEALTH-VERDICT (LAT-5276-aanname) ==="
            echo "restart policy live : $(docker inspect -f '{{.HostConfig.RestartPolicy.Name}}:{{.HostConfig.RestartPolicy.MaximumRetryCount}}' "$LIVE")"
            echo "autoheal-achtige containers:"
            docker ps --format '{{.Names}} {{.Image}}' | grep -Ei 'autoheal|willfarrell|docker-autoheal' | sed 's/^/  /' || true
            docker ps --format '{{.Names}}' | grep -Eiq 'autoheal' || echo "  geen"
            echo "live expiry-drempels (geen secrets, gewone getallen):"
            docker exec "$LIVE" sh -c 'echo "  WARN_DAYS=${HEALTH_EXPIRY_WARN_DAYS:-<default 14>} FAIL_DAYS=${HEALTH_EXPIRY_FAIL_DAYS:-<default 2>}"' 2>/dev/null \
              || echo "  (exec niet mogelijk)"
            # De WARN-tier leunt erop dat het 14-daagse alarm van LAT-3858 DIT token dekt. Dat
            # alarm controleert `github-publish.env:GH_TOKEN`; de dispatcher pakt echter
            # `process.env.GH_TOKEN` (env_file) VOOR /run/secrets/github-publish.env. Draait
            # productie op een env_file-token met een andere waarde, dan bewaakt het alarm een
            # ander credential dan de dispatcher gebruikt en vuurt de 14-daagse waarschuwing
            # nooit voor deze. Alleen de fp (16 tekens sha256), nooit de waarde.
            echo "live token-herkomst en fp (LAT-5276 -> dekking LAT-3858):"
            docker exec "$LIVE" sh -c 'printf "  fp=%s len=%s\n" "$(printf %s "$GH_TOKEN" | sha256sum | cut -c1-16)" "${#GH_TOKEN}"' 2>/dev/null \
              || echo "  (exec niet mogelijk)"
            # Niet `... | sed || echo`: de exit-status van een pipeline is die van de LAATSTE
            # stap, dus die fallback vuurt nooit en "niets gevonden" ziet er dan uit als stilte.
            HERKOMST=$(docker logs "$LIVE" 2>&1 | grep -o 'GH_TOKEN loaded from [a-z ()_]*' | tail -1)
            if [ -n "$HERKOMST" ]; then echo "  $HERKOMST"; else
              echo "  (herkomst-regel staat niet meer in de bewaarde logs — log-rotatie, LAT-3214)"; fi
            echo "  vergelijk met: github-publish.env=88eda9dd… (door LAT-3858 bewaakt),"
            echo "                 store 5e58949a v4=2fe4c9c5… (NIET in de bestand-inventaris)"
            echo "Docker herstart zelf NIET op unhealthy (alleen Swarm/autoheal doet dat);"
            echo "restart policy hierboven zegt alleen iets over EXIT, niet over health."

            # Stub-GitHub (CommonJS, daarom .cjs: het image zelf is ESM). Antwoordt met een
            # vaste status; de expiry-header staat ver weg zodat de expiry-as het verdict
            # niet vertroebelt. 403 -> degraded, 422 -> ok.
            STUB_403=''
            STUB_422=''

            # Body-ophaler. NIET met `wget -qO-`: busybox/GNU wget gooit de body weg zodra de
            # status niet-2xx is (rc=8, lege stdout). Precies de twee ROOD-cases antwoorden 503,
            # dus de body-eis kon daar per constructie nooit slagen — de eerste run (31591876535)
            # faalde daarop, terwijl de container wel degelijk unhealthy werd. Een controle die
            # alleen in het groene geval kan slagen is dezelfde fout als het ticket zelf aanklaagt.
            # Node zit in het image en leest de body ongeacht de status; hij print
            # "http_status=<n> <body>" zodat de status zelf ook toetsbaar is.
            FETCH_B64=''

            # $1 naam  $2 token  $3 api-base  $4 verwachte health  $5 stub-b64 of "-"
            # $6 tekst die in de /health-body MOET staan ("-" = geen eis)
            # $7 verwachte HTTP-status van /health ("-" = geen eis)
            #
            # $6/$7 bestaan omdat het health-verdict alleen niet genoeg is: valt het netwerk weg,
            # dan gaat de container ook rood, en dan zou ROOD 1/2 slagen om de verkeerde reden.
            # De body moet aantonen dat het verdict uit de ECHTE probe-status komt.
            run_case() {
              NAME=$1; TOKEN=$2; APIBASE=$3; WANT=$4; STUB=$5; WANT_BODY=$6; WANT_HTTP=$7
              echo
              echo "----------------------------------------------------------------"
              echo "case: $NAME   verwacht docker health=$WANT"
              # Nooit een tokenwaarde printen; lengte + hash is genoeg om te identificeren.
              echo "      token len=${#TOKEN} fp=$(printf %s "$TOKEN" | sha256sum | cut -c1-16)"

              docker rm -f "$NAME" >/dev/null 2>&1 || true

              if [ "$STUB" = "-" ]; then
                CMD='exec node src/index.js'
              else
                CMD="echo $STUB | base64 -d > /tmp/stub.cjs && node /tmp/stub.cjs & sleep 1; exec node src/index.js"
              fi

              # PUBLISH_PORT=3201 zodat de HEALTHCHECK uit het image (default 3201) meet.
              docker run -d --rm --name "$NAME" \
                -e BRIDGE_HMAC_SECRET=lat3875-redtest-not-a-real-secret \
                -e PUBLISH_PORT=3201 \
                -e STATE_DIR=/tmp \
                -e LOG_LEVEL=info \
                -e GITHUB_REPO=marijnp7/vinomartino-site \
                -e GITHUB_WORKFLOW=deploy.yml \
                -e GITHUB_API_BASE="$APIBASE" \
                -e GH_TOKEN="$TOKEN" \
                --entrypoint sh "$IMG" -c "$CMD" >/dev/null || {
                  echo "  ::error::docker run faalde voor $NAME"; FAILED=1; return; }

              # HEALTHCHECK: interval 30s, retries 3 -> een echt kapot token moet binnen
              # ~2 min op unhealthy staan. Tot 240s pollen zodat een FAIL nooit ongeduld is.
              S=starting
              i=0
              while [ $i -lt 48 ]; do
                sleep 5
                i=$((i + 1))
                S=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}GEEN-HEALTHCHECK{{end}}' "$NAME" 2>/dev/null || echo weg)
                case "$S" in healthy|unhealthy|GEEN-HEALTHCHECK|weg) break ;; esac
              done
              echo "  docker health na $((i * 5))s: $S"
              BODY=$(docker exec "$NAME" sh -c "echo $FETCH_B64 | base64 -d > /tmp/fetch.cjs && node /tmp/fetch.cjs" 2>/dev/null)
              echo "  /health: $BODY"
              echo "  laatste healthcheck-log:"
              docker inspect -f '{{if .State.Health}}{{range .State.Health.Log}}{{.ExitCode}} {{.Output}}{{end}}{{end}}' "$NAME" 2>/dev/null | tail -c 400 | sed 's/^/    /'

              OK=1
              if [ "$S" != "$WANT" ]; then
                echo "  FAIL: docker health is $S, verwacht $WANT"
                OK=0
              fi
              if [ "$WANT_BODY" != "-" ]; then
                # Meerdere eisen, gescheiden door "|". Nodig sinds LAT-5276: bij de expiry-cases
                # moet de body tegelijk aantonen WELKE as het verdict zette. Een case die alleen
                # `"state":"degraded"` eist zou ook slagen als de capability-probe stukging.
                OLDIFS=$IFS
                set -f            # geen pathname-expansie op de losse eisen
                IFS='|'
                for want in $WANT_BODY; do
                  IFS=$OLDIFS
                  case "$BODY" in
                    *"$want"*) : ;;
                    *) echo "  FAIL: /health-body bevat '$want' niet — verdict komt niet uit de echte probe"; OK=0 ;;
                  esac
                  IFS='|'
                done
                IFS=$OLDIFS
                set +f
              fi
              if [ "$WANT_HTTP" != "-" ]; then
                case "$BODY" in
                  "http_status=$WANT_HTTP "*) : ;;
                  *) echo "  FAIL: /health gaf niet HTTP $WANT_HTTP — de compose-healthcheck leest de status, dus die moet kloppen"; OK=0 ;;
                esac
              fi
              if [ "$OK" = 1 ]; then
                echo "  RESULT: PASS"
              else
                echo "  RESULT: FAIL"
                FAILED=1
              fi
              docker rm -f "$NAME" >/dev/null 2>&1 || true
            }

            echo
            echo "=== 1. ROOD 1/2: ingetrokken/ongeldig token, echte api.github.com -> 401 ==="
            run_case lat3875-ct-red401 "github_pat_11NOTAREALTOKEN_lat3875_redtest" "https://api.github.com" unhealthy - '"probe_status":401' 503

            echo
            echo "=== 2. ROOD 2/2: onderscoped token (stub antwoordt 403) -> degraded ==="
            # Bewust een stub en niet het echte productietoken: dat heeft sinds LAT-4715
            # wel Actions:write (422), dus het kan het onderscoped-geval niet meer spelen.
            run_case lat3875-ct-red403 "lat3875-stub-token-not-real" "http://127.0.0.1:8080" unhealthy "$STUB_403" '"probe_status":403' 503

            echo
            echo "=== 3. GROENE CONTROLE: stub antwoordt 422 -> de check kan ook groen ==="
            run_case lat3875-ct-green422 "lat3875-stub-token-not-real" "http://127.0.0.1:8080" healthy "$STUB_422" '"probe_status":422' 200

            echo
            echo "=== 3b. EXPIRY WARN-TIER: token werkt (422), verloopt over ~5 dagen ==="
            # De drie cases hierboven pinnen expiry bewust ver weg, zodat de expiry-as het
            # probe-verdict niet vertroebelt. Gevolg: de expiry-regel uit LAT-3875 werd door
            # geen enkele case aangeraakt en kon dus niet rood worden. 3b en 3c isoleren die as:
            # capability in orde (422), alleen de vervaldatum verschilt.
            #
            # 3b zat tot LAT-5276 alleen op de DETECTIE (`warn` gevuld) en liet het verdict
            # bewust ongemoeid, omdat toen niet vaststond welk verdict hoorde. Dat besluit is
            # nu genomen (kop van dit bestand): tussen 2 en 14 dagen hoort de container GROEN te
            # blijven. Dat is hier geen waarneming die is overgenomen maar de verwachting uit het
            # besluit — vandaar dat `"state":"ok"` en HTTP 200 nu HARDE eisen zijn. Zou iemand
            # LAT-3875 alsnog letterlijk implementeren (degraded onder 14d), dan gaat deze case
            # rood, en dat is precies de bedoeling.
            #
            # De datum wordt bij elke run berekend, niet vastgezet: een hardgecodeerde datum
            # verschuift stilletjes van "verloopt bijna" naar "al verlopen" en meet dan iets anders.
            EXP_SOON=$(date -u -d '+5 days' '+%Y-%m-%d %H:%M:%S UTC')
            echo "expiry-stub meldt vervaldatum: $EXP_SOON (~5 dagen: onder WARN=14, boven FAIL=2)"
            cat > /tmp/lat3875-cto-expiry-stub.cjs <<STUBEOF
            const h=require("node:http");h.createServer((q,s)=>{s.writeHead(422,{"content-type":"application/json","github-authentication-token-expiration":"$EXP_SOON"});s.end('{"message":"No ref found"}');}).listen(8080,"127.0.0.1");
            STUBEOF
            STUB_EXPIRY=$(base64 -w0 < /tmp/lat3875-cto-expiry-stub.cjs)
            # De warn-eis staat op de tekst, niet op een berekend getal: `expires_in_days` is
            # afgeleid van de stub-datum en zou dan zichzelf toetsen. `"probe_status":422` erbij,
            # zodat een groen verdict dat uit iets anders komt dan een geslaagde probe niet als
            # PASS kan doorgaan.
            run_case lat3875-ct-expiry-warn "lat3875-stub-token-not-real" "http://127.0.0.1:8080" healthy "$STUB_EXPIRY" '"warn":"token expires in|"state":"ok"|"probe_status":422' 200

            echo
            echo "=== 3c. EXPIRY FAIL-TIER: token werkt (422), verloopt over ~1 dag ==="
            # De andere helft van het LAT-5276-besluit, en de enige case die de FAIL-drempel
            # aanraakt. Zonder deze case is HEALTH_EXPIRY_FAIL_DAYS een tak die nooit is
            # uitgevoerd — dezelfde soort dode drempel als waar LAT-3875 over ging.
            #
            # `(< 2d)` in de reason is de scherpe eis: die tekst komt ALLEEN uit de FAIL-tak en
            # pint tegelijk de drempelwaarde uit het besluit. `"probe_status":422` bewijst dat het
            # rood van de EXPIRY-as komt en niet van een kapotte capability-probe of een
            # weggevallen netwerk — zonder die eis zou deze case om de verkeerde reden slagen.
            EXP_CRIT=$(date -u -d '+1 day' '+%Y-%m-%d %H:%M:%S UTC')
            echo "expiry-stub meldt vervaldatum: $EXP_CRIT (~1 dag, dus onder FAIL=2)"
            cat > /tmp/lat3875-cto-expiry-crit-stub.cjs <<STUBEOF
            const h=require("node:http");h.createServer((q,s)=>{s.writeHead(422,{"content-type":"application/json","github-authentication-token-expiration":"$EXP_CRIT"});s.end('{"message":"No ref found"}');}).listen(8080,"127.0.0.1");
            STUBEOF
            STUB_EXPIRY_CRIT=$(base64 -w0 < /tmp/lat3875-cto-expiry-crit-stub.cjs)
            run_case lat3875-ct-expiry-fail "lat3875-stub-token-not-real" "http://127.0.0.1:8080" unhealthy "$STUB_EXPIRY_CRIT" '"state":"degraded"|(< 2d) at|"probe_status":422' 503

            echo
            echo "=== 4. OPRUIMEN weesresten van 2026-08-05 (LAT-3875 punt 4) ==="
            # `lat3875-ct-expiry` heette zo tot LAT-5276 en is nu gesplitst in -warn/-fail;
            # een run die halverwege afbrak kan die oude naam nog laten staan.
            for c in lat3875-y lat3875-red-401 lat3875-red-403b lat3875-red-403 lat3875-green-422 lat3875-ct-expiry; do
              if docker inspect "$c" >/dev/null 2>&1; then
                docker rm -f "$c" >/dev/null 2>&1 && echo "  verwijderd: $c" || echo "  KON NIET verwijderen: $c"
              else
                echo "  niet aanwezig: $c"
              fi
            done

            echo
            echo "=== 5. PRODUCTIE ONAANGETAST? ==="
            echo "live health status na afloop: $(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}GEEN-HEALTHCHECK{{end}}' "$LIVE")"
            echo "live image id na afloop     : $(docker inspect -f '{{.Image}}' "$LIVE")"

            echo
            if [ "$FAILED" = 0 ]; then
              echo "LAT3875_REDTEST=PASS"
            else
              echo "LAT3875_REDTEST=FAIL"
              exit 1
            fi
        run: |
          printf '%s\n' "$SCRIPT" | ssh "$VPS" "bash -s"
