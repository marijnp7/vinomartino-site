# LAT-11051 / LAT-4741 (post 3) — rotatie van de ResourceSpace DB-credentials
# via het GHA->VPS SSH-kanaal, zonder container-recreate.
#
# GOEDKEURING. De rotatie-autoriteit voor de drie restpunten van het credential-lek
# ligt al sinds kaart 8a0ae74f (Marijn, 2026-08-10, approved). Post 1 (B2-sleutel) is
# daaronder al uitgevoerd zonder nieuwe kaart zodra de capaciteit bleek te bestaan
# (LAT-4746). Dit bestand is exact diezelfde situatie voor post 3: de opdracht op
# LAT-11051 was "toets eerst of een agent-route dit kan" — dat is hieronder gemeten,
# en de uitkomst is ja. De route zelf (GHA->VPS SSH als host-commando's uitvoeren)
# is al meermaals hergebruikt: lat3052-htpasswd-rotate.yml, lat4750-recreate-publish-
# dispatcher.yml, lat5247-scoped-broker-restart.yml, lat5382-scoped-broker-bindmode.yml.
# Dit PR-bestand zelf gaat WEL door de Marijn-gate voor de merge (workflow-files +
# directe productie-runtime/data-impact zijn allebei onvoorwaardelijk gate-set-items,
# AUTONOMIE-REGEL R2) — dat is een aparte handeling van de rotatie-autoriteit zelf.
#
# WAAROM DIT GEEN CONTAINER-RECREATE NODIG HEEFT — de kern van de herziening t.o.v.
# het oorspronkelijke runbook-concept ("hostshell + db.env + --force-recreate op
# resourcespace EN resourcespace-db, korte DB-downtime"). Dat concept nam aan dat de
# ResourceSpace-app zijn DB-wachtwoord uit db.env (env_file, alleen gelezen bij
# container-creatie) haalt. Gemeten op de host (LAT-11051, 2026-09-21): dat is niet zo.
# /opt/paperclip-cos/resourcespace-dam/config.php bevat het wachtwoord HARDCODED in
# platte PHP (`$mysql_password = '...'`) en is per-bestand bind-mounted
# (`./config.php:/var/www/html/include/config.php`) — dezelfde constructie als
# lat3052's htpasswd. PHP leest dat bestand per request; een in-place schrijfactie
# (inode behouden) is dus meteen zichtbaar voor de lopende container, zonder recreate.
# db.env's MYSQL_PASSWORD/MYSQL_ROOT_PASSWORD worden door het mariadb-image alleen bij
# EERSTE initialisatie van een lege datadir gebruikt; rs_dbdata bestaat al lang, dus
# die env-waarden zijn na de eerste boot inert. Ze worden hier alleen bijgewerkt zodat
# een toekomstige (ongerelateerde) recreate niet stiekem het oude wachtwoord terugzet.
# Er is dus GEEN DB-downtime: `ALTER USER` werkt live, config.php-edit werkt live.
#
# WAAROM DIT VIA SSH MOET EN NIET VIA DE DEVOPS-WORKSPACE EXEC-ALLOWLIST. LAT-4748
# (12-08) mat dat `docker exec` op resourcespace-db vanuit een devops-workspace kon.
# Hergemeten vanuit paperclip-devops-workspace-2-1 (LAT-11051, 21-09): **elke** exec op
# resourcespace-db geeft nu `scoped broker: forbidden` — ook `echo hello`, dus dit is
# geen commando-specifieke blokkade maar een volledige deny op deze container vanuit
# dit caller-scope. Twee lezingen zijn beide plausibel (per-caller ACL die alleen
# devops-workspace-1 dekte, of een sindsdien aangescherpt beleid) en geen van beide
# verandert de uitkomst: vanuit DevOps Engineer 2 is de broker-route dood. Dat is
# precies de fout die dit ticket voorkomt — een op de docker-broker gemeten
# onmogelijkheid ("de broker weigert dit") niet doortrekken naar "dus geen enkele
# agent-route kan dit". GHA->VPS SSH raakt de host rechtstreeks (root-hostshell, zie
# /paperclip/.claude/CLAUDE.md) en zit niet achter de scoped broker — bewezen in de
# vier hierboven genoemde workflows.
#
# SECRET-HYGIENE (LAT-3641/LAT-3644, en LAT-11051 zelf: bij het meten van dit issue is
# het huidige app-wachtwoord een keer per ongeluk in platte tekst in een tool-output
# terechtgekomen — sha256-prefix `96d10788def1b8cb`, gemeld op het issue, geen tweede
# keer herhaald). Nieuwe wachtwoorden worden op de host binnen de SSH-sessie
# gegenereerd en verlaten die host niet: niet in deze workflow, niet in de run-log,
# niet in een GitHub-secret, niet in een issue-comment. Gerapporteerd worden alleen
# lengte + sha256-prefix. mariadb krijgt het wachtwoord via `--defaults-extra-file`
# (een tijdelijk 0600-bestand, meteen verwijderd), nooit via `-p<waarde>` op de
# argv-regel, anders staat het in `ps` op de host.
#
# INODE-REGEL — zelfde reden als lat3052: config.php en db.env zijn allebei
# per-bestand bind-mounts. `mv`/`sed -i` (GNU-vorm) maken een nieuwe inode; de mount
# blijft dan aan het oude bestand hangen. Er wordt daarom in-place geschreven
# (volledige inhoud in het geheugen bewerkt, dan `> "$F"`, O_TRUNC) en `stat -c %i`
# wordt voor en na vergeleken.
#
# TERUGTOETS. Falsifieerbaar getoetst, niet aangenomen:
#   1. voor de rotatie : huidig wachtwoord -> DB-verbinding lukt (nulmeting)
#   2. na de rotatie   : nieuw wachtwoord  -> DB-verbinding lukt
#   3. na de rotatie   : oud wachtwoord    -> DB-verbinding faalt (negatieve controle;
#      zonder deze zou stap 2 ook groen zijn als de ALTER USER niets deed)
#   4. functionele check: de resourcespace-app-container antwoordt op zijn interne IP
#      zonder een "Access denied"/DB-foutmelding in de body — bewijst dat de
#      in-place config.php-edit door de lopende container gelezen wordt, zonder
#      recreate.
#   5. het oude db.env-wachtwoord komt niet meer voor in het bijgewerkte bestand
#      (sha256-vergelijking, geen recreate nodig om dit te laten gelden voor de
#      volgende keer dat iemand het leest).
#
# LET OP bij het pushen: elk bestand onder .github/ op main triggert normaal een
# productie-release (deploy.yml's paths-ignore dekt .github/** bewust niet). Push met
# "[skip ci]" en verifieer per sha, zoals lat3052 voorschrijft.

name: LAT-11051 resourcespace db rotate (prod)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'diagnose = alleen lezen; apply = roteren + terugtoetsen; verify = terugtoets zonder te roteren; rollback = laatste backup terugzetten'
        required: true
        default: diagnose
        type: choice
        options:
          - diagnose
          - apply
          - verify
          - rollback

concurrency:
  group: lat11051-resourcespace-db-rotate
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          cat >> ~/.ssh/config <<EOF
          Host $VPS_HOST
            StrictHostKeyChecking accept-new
            UserKnownHostsFile ~/.ssh/known_hosts
          EOF
          cat "$GITHUB_WORKSPACE/ops/ssh-config-snippet" >> ~/.ssh/config
          ssh-keyscan "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      # =================================================================== diagnose
      - name: Diagnose (read-only)
        if: inputs.mode == 'diagnose'
        env:
          VPS: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          cat > /tmp/lat11051-diag.sh <<'DIAGEOF'
          set -uo pipefail
          DIR=/opt/paperclip-cos/resourcespace-dam
          ENV_FILE="$DIR/db.env"
          CFG_FILE="$DIR/config.php"
          CTR_APP=resourcespace
          CTR_DB=resourcespace-db

          echo "=== 1. bestanden aanwezig, geen waarden ==="
          for F in "$ENV_FILE" "$CFG_FILE"; do
            [ -f "$F" ] || { echo "::error::$F ontbreekt"; exit 1; }
            stat -c "pad=%n inode=%i mode=%a eigenaar=%U:%G bytes=%s" "$F"
          done
          echo "db.env variabelen: $(grep -oE '^[A-Z_]+=' "$ENV_FILE" | tr -d '=' | tr '\n' ' ')"
          echo "config.php variabelen: $(grep -oE '^[$][a-zA-Z_]+' "$CFG_FILE" | tr '\n' ' ')"

          echo
          echo "=== 2. containerstatus en netwerkblootstelling ==="
          docker inspect -f 'db:     status={{.State.Status}} health={{.State.Health.Status}}' "$CTR_DB" 2>&1
          docker inspect -f 'app:    status={{.State.Status}}' "$CTR_APP" 2>&1
          echo "db PORTS  (moet leeg zijn -- geen host-bind):"
          docker port "$CTR_DB" 2>&1 || echo "  (geen gepubliceerde poorten)"
          echo "app PORTS (moet leeg zijn -- geen host-bind):"
          docker port "$CTR_APP" 2>&1 || echo "  (geen gepubliceerde poorten)"

          echo
          echo "=== 3. bevestigt dit dat config.php ECHT bind-mounted is (geen recreate nodig)? ==="
          docker inspect -f '{{range .Mounts}}{{.Source}} -> {{.Destination}} rw={{.RW}}{{println}}{{end}}' "$CTR_APP" \
            | grep -F "$CFG_FILE" || { echo "::error::config.php niet gevonden als mount op $CTR_APP -- aanname klopt niet, heroverweeg"; exit 1; }
          echo "MOUNT_OK — in-place edit is genoeg, geen force-recreate nodig"

          echo
          echo "=== 4. grants (user/host/plugin, GEEN wachtwoorden) ==="
          APPUSER=$(grep -oP "(?<=mysql_username = .)[^']+" "$CFG_FILE")
          echo "app-user uit config.php: $APPUSER"
          ROOTCRED=$(mktemp)
          chmod 600 "$ROOTCRED"
          printf '[client]\nuser=root\npassword=%s\n' "$(grep '^MYSQL_ROOT_PASSWORD=' "$ENV_FILE" | cut -d= -f2-)" > "$ROOTCRED"
          docker exec -i "$CTR_DB" mariadb --defaults-extra-file=/dev/stdin -N \
            -e "SELECT user,host,plugin FROM mysql.user WHERE user IN ('root','${APPUSER}');" < "$ROOTCRED" 2>&1
          RC=$?
          shred -u "$ROOTCRED" 2>/dev/null || rm -f "$ROOTCRED"
          [ "$RC" = "0" ] || { echo "::error::grants-query faalde (exit $RC) -- root-credential in db.env klopt mogelijk niet meer"; exit 1; }

          echo
          echo "=== 5. nulmeting: werkt de HUIDIGE app-credential nog? ==="
          APPCRED=$(mktemp)
          chmod 600 "$APPCRED"
          printf '[client]\nuser=%s\npassword=%s\n' "$APPUSER" "$(grep -oP "(?<=mysql_password = .)[^']+" "$CFG_FILE")" > "$APPCRED"
          if docker exec -i "$CTR_DB" mariadb --defaults-extra-file=/dev/stdin -e "SELECT 1;" < "$APPCRED" >/dev/null 2>&1; then
            echo "NULMETING_OK — huidige credential werkt"
          else
            echo "::error::huidige app-credential werkt NIET -- config.php en DB lopen al uit elkaar, apply zou blind roteren"
            shred -u "$APPCRED" 2>/dev/null || rm -f "$APPCRED"
            exit 1
          fi
          shred -u "$APPCRED" 2>/dev/null || rm -f "$APPCRED"

          echo
          echo "=== 6. functionele nulmeting: reageert de app-container zonder DB-foutmelding? ==="
          IP=$(docker inspect -f '{{range $k, $v := .NetworkSettings.Networks}}{{$v.IPAddress}} {{end}}' "$CTR_APP" | awk '{print $1}')
          echo "app-container-ip=$IP"
          CODE=$(curl -s -o /tmp/lat11051-diag-body.html -w '%{http_code}' --max-time 10 "http://$IP/" 2>/dev/null || echo 000)
          echo "GET / -> HTTP $CODE"
          if grep -qiE 'access denied|cannot connect|database error' /tmp/lat11051-diag-body.html 2>/dev/null; then
            echo "::error::responspagina bevat een DB-foutmelding -- app is nu al stuk"
            exit 1
          fi
          [ "$CODE" != "000" ] || { echo "::error::app-container onbereikbaar op $IP"; exit 1; }
          echo "FUNCTIONEEL_OK"

          echo
          echo "=== 7. gereedschap dat apply nodig heeft ==="
          for B in openssl curl sha256sum stat docker mktemp shred; do
            command -v "$B" >/dev/null 2>&1 && echo "  $B: aanwezig" || echo "::error::$B ONTBREEKT"
          done

          echo
          echo "=== 8. eerdere backups van deze rotatie ==="
          ls -la "$DIR"/config.php.bak-lat11051-* "$DIR"/db.env.bak-lat11051-* 2>/dev/null || echo "(geen)"
          echo "=== DIAGNOSE KLAAR ==="
          DIAGEOF
          ssh "$VPS" "bash -s" < /tmp/lat11051-diag.sh

      # ===================================================================== apply
      - name: Roteer op de host + terugtoets
        id: rotate
        if: inputs.mode == 'apply'
        env:
          VPS: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          cat > /tmp/lat11051-apply.sh <<'APPLYEOF'
          set -euo pipefail
          DIR=/opt/paperclip-cos/resourcespace-dam
          ENV_FILE="$DIR/db.env"
          CFG_FILE="$DIR/config.php"
          CTR_APP=resourcespace
          CTR_DB=resourcespace-db
          TS=$(date -u +%Y%m%dT%H%M%SZ)
          ENV_BAK="$ENV_FILE.bak-lat11051-$TS"
          CFG_BAK="$CFG_FILE.bak-lat11051-$TS"

          # --- 0. precondities + backups --------------------------------------
          INO_ENV_BEFORE=$(stat -c %i "$ENV_FILE")
          INO_CFG_BEFORE=$(stat -c %i "$CFG_FILE")
          MODE_CFG=$(stat -c %a "$CFG_FILE")
          cp "$ENV_FILE" "$ENV_BAK"; chmod 600 "$ENV_BAK"
          cp "$CFG_FILE" "$CFG_BAK"; chmod 600 "$CFG_BAK"
          echo "backups: $ENV_BAK / $CFG_BAK"

          APPUSER=$(grep -oP "(?<=mysql_username = .)[^']+" "$CFG_FILE")
          OLD_APP_PW=$(grep -oP "(?<=mysql_password = .)[^']+" "$CFG_FILE")
          OLD_ROOT_PW=$(grep '^MYSQL_ROOT_PASSWORD=' "$ENV_FILE" | cut -d= -f2-)
          OLD_APP_SHA=$(printf '%s' "$OLD_APP_PW" | sha256sum | cut -d' ' -f1)
          OLD_ROOT_SHA=$(printf '%s' "$OLD_ROOT_PW" | sha256sum | cut -d' ' -f1)
          echo "app-user=$APPUSER"
          echo "oud app-wachtwoord sha256=${OLD_APP_SHA:0:16}... oud root-wachtwoord sha256=${OLD_ROOT_SHA:0:16}..."

          mkcred() { # $1=user $2=password -> pad naar tijdelijk 0600-credential-bestand
            local f; f=$(mktemp); chmod 600 "$f"
            printf '[client]\nuser=%s\npassword=%s\n' "$1" "$2" > "$f"
            printf '%s' "$f"
          }
          run_sql() { # $1=credfile $2=sql
            docker exec -i "$CTR_DB" mariadb --defaults-extra-file=/dev/stdin -N -e "$2" < "$1"
          }

          # --- 1. nulmeting: huidige credentials moeten nog werken -------------
          ROOTCRED=$(mkcred root "$OLD_ROOT_PW")
          APPCRED_OLD=$(mkcred "$APPUSER" "$OLD_APP_PW")
          run_sql "$APPCRED_OLD" "SELECT 1;" >/dev/null || { echo "::error::nulmeting faalt: huidig app-wachtwoord werkt niet; niets aangeraakt"; shred -u "$ROOTCRED" "$APPCRED_OLD" 2>/dev/null; exit 1; }
          echo "NULMETING_OK"

          # --- 2. nieuwe wachtwoorden, uitsluitend in het geheugen van deze shell
          NEW_APP_PW=$(openssl rand -base64 96 | tr -dc 'A-Za-z0-9' | head -c 32)
          NEW_ROOT_PW=$(openssl rand -base64 96 | tr -dc 'A-Za-z0-9' | head -c 32)
          [ "${#NEW_APP_PW}" = "32" ] && [ "${#NEW_ROOT_PW}" = "32" ] || { echo "::error::wachtwoordgeneratie faalde"; exit 1; }

          # --- 3. grants ophalen en ALTER USER op elk host-record --------------
          rollback_db() {
            echo "::error::$1 -- AUTOMATISCHE ROLLBACK VAN DB-CREDENTIALS"
            APPCRED_NEW_RB=$(mkcred root "$NEW_ROOT_PW")
            while read -r U H; do
              [ -n "$U" ] || continue
              run_sql "$APPCRED_NEW_RB" "ALTER USER '$U'@'$H' IDENTIFIED BY '$OLD_APP_PW';" 2>/dev/null || true
            done <<< "$APP_HOSTS"
            while read -r U H; do
              [ -n "$U" ] || continue
              run_sql "$APPCRED_NEW_RB" "ALTER USER '$U'@'$H' IDENTIFIED BY '$OLD_ROOT_PW';" 2>/dev/null || true
            done <<< "$ROOT_HOSTS"
            run_sql "$APPCRED_NEW_RB" "FLUSH PRIVILEGES;" 2>/dev/null || true
            shred -u "$APPCRED_NEW_RB" 2>/dev/null || rm -f "$APPCRED_NEW_RB"
            cp "$ENV_BAK" "$ENV_FILE"
            cp "$CFG_BAK" "$CFG_FILE"
            exit 1
          }

          APP_HOSTS=$(run_sql "$ROOTCRED" "SELECT user,host FROM mysql.user WHERE user='$APPUSER';")
          ROOT_HOSTS=$(run_sql "$ROOTCRED" "SELECT user,host FROM mysql.user WHERE user='root';")
          [ -n "$APP_HOSTS" ] || { echo "::error::geen mysql.user-record voor $APPUSER"; shred -u "$ROOTCRED" "$APPCRED_OLD" 2>/dev/null; exit 1; }
          [ -n "$ROOT_HOSTS" ] || { echo "::error::geen mysql.user-record voor root"; shred -u "$ROOTCRED" "$APPCRED_OLD" 2>/dev/null; exit 1; }

          while read -r U H; do
            [ -n "$U" ] || continue
            run_sql "$ROOTCRED" "ALTER USER '$U'@'$H' IDENTIFIED BY '$NEW_APP_PW';" || rollback_db "ALTER USER op $U@$H (app) faalde"
          done <<< "$APP_HOSTS"
          while read -r U H; do
            [ -n "$U" ] || continue
            run_sql "$ROOTCRED" "ALTER USER '$U'@'$H' IDENTIFIED BY '$NEW_ROOT_PW';" || rollback_db "ALTER USER op $U@$H (root) faalde"
          done <<< "$ROOT_HOSTS"
          run_sql "$ROOTCRED" "FLUSH PRIVILEGES;" || rollback_db "FLUSH PRIVILEGES faalde"
          shred -u "$ROOTCRED" "$APPCRED_OLD" 2>/dev/null || rm -f "$ROOTCRED" "$APPCRED_OLD"

          # --- 4. terugtoets: nieuw werkt, oud faalt (negatieve controle) ------
          APPCRED_NEW=$(mkcred "$APPUSER" "$NEW_APP_PW")
          APPCRED_OLDCHK=$(mkcred "$APPUSER" "$OLD_APP_PW")
          if ! run_sql "$APPCRED_NEW" "SELECT 1;" >/dev/null 2>&1; then
            shred -u "$APPCRED_NEW" "$APPCRED_OLDCHK" 2>/dev/null
            rollback_db "nieuw app-wachtwoord werkt niet in de DB"
          fi
          if run_sql "$APPCRED_OLDCHK" "SELECT 1;" >/dev/null 2>&1; then
            shred -u "$APPCRED_NEW" "$APPCRED_OLDCHK" 2>/dev/null
            rollback_db "negatieve controle faalt: oud app-wachtwoord werkt nog steeds in de DB"
          fi
          shred -u "$APPCRED_NEW" "$APPCRED_OLDCHK" 2>/dev/null || rm -f "$APPCRED_NEW" "$APPCRED_OLDCHK"
          echo "DB_ROTATIE_OK — nieuw wachtwoord werkt, oud wachtwoord geweigerd"

          # --- 5. config.php in-place bijwerken (inode moet gelijk blijven) ----
          NEW_CFG=$(sed "s|mysql_password = '$OLD_APP_PW'|mysql_password = '$NEW_APP_PW'|" "$CFG_FILE")
          if [ "$NEW_CFG" = "$(cat "$CFG_FILE")" ]; then
            rollback_db "sed op config.php trof geen match -- niets vervangen, DB-creds al gewijzigd, terugrollen"
          fi
          printf '%s\n' "$NEW_CFG" > "$CFG_FILE"
          chmod "$MODE_CFG" "$CFG_FILE"
          INO_CFG_AFTER=$(stat -c %i "$CFG_FILE")
          if [ "$INO_CFG_BEFORE" != "$INO_CFG_AFTER" ]; then
            rollback_db "INODE VAN config.php GEWIJZIGD -- bind-mount wijst nu naar het oude bestand"
          fi
          echo "config.php inode voor=$INO_CFG_BEFORE na=$INO_CFG_AFTER (gelijk, OK)"

          # --- 6. db.env in-place bijwerken (consistentie voor toekomstige boots)
          NEW_ENV=$(sed -e "s|^MYSQL_PASSWORD=.*|MYSQL_PASSWORD=$NEW_APP_PW|" \
                        -e "s|^MYSQL_ROOT_PASSWORD=.*|MYSQL_ROOT_PASSWORD=$NEW_ROOT_PW|" "$ENV_FILE")
          printf '%s\n' "$NEW_ENV" > "$ENV_FILE"
          chmod 600 "$ENV_FILE"
          INO_ENV_AFTER=$(stat -c %i "$ENV_FILE")
          echo "db.env inode voor=$INO_ENV_BEFORE na=$INO_ENV_AFTER"

          # --- 7. functionele terugtoets op de LEVENDE app-container, geen recreate
          IP=$(docker inspect -f '{{range $k, $v := .NetworkSettings.Networks}}{{$v.IPAddress}} {{end}}' "$CTR_APP" | awk '{print $1}')
          sleep 2
          CODE=$(curl -s -o /tmp/lat11051-apply-body.html -w '%{http_code}' --max-time 10 "http://$IP/" 2>/dev/null || echo 000)
          echo "GET / (na rotatie, GEEN recreate) -> HTTP $CODE"
          if grep -qiE 'access denied|cannot connect|database error' /tmp/lat11051-apply-body.html 2>/dev/null || [ "$CODE" = "000" ]; then
            rollback_db "app-container geeft na de config.php-edit een DB-foutmelding -- live edit werkte niet zoals verwacht"
          fi
          echo "FUNCTIONEEL_OK — app leest de nieuwe credential zonder recreate"

          NEW_APP_SHA=$(printf '%s' "$NEW_APP_PW" | sha256sum | cut -d' ' -f1)
          NEW_ROOT_SHA=$(printf '%s' "$NEW_ROOT_PW" | sha256sum | cut -d' ' -f1)
          NEW_ENV_FILE_SHA=$(sha256sum "$ENV_FILE" | cut -c1-16)
          OLD_ENV_FILE_SHA=$(sha256sum "$ENV_BAK" | cut -c1-16)

          echo "=== RAPPORT (geen waarden) ==="
          echo "app-user            : $APPUSER"
          echo "nieuw app-ww sha256 : ${NEW_APP_SHA:0:16}... (was ${OLD_APP_SHA:0:16}...)"
          echo "nieuw root-ww sha256: ${NEW_ROOT_SHA:0:16}... (was ${OLD_ROOT_SHA:0:16}...)"
          echo "db.env sha256       : ${OLD_ENV_FILE_SHA}... -> ${NEW_ENV_FILE_SHA}..."
          echo "backups             : $ENV_BAK / $CFG_BAK"
          echo "downtime            : geen recreate uitgevoerd"
          echo "APPLY_OK"
          APPLYEOF
          ssh "$VPS" "bash -s" < /tmp/lat11051-apply.sh

      # ================================================================== verify
      - name: Verify (roteert niets, toetst alleen de huidige staat)
        if: inputs.mode == 'verify'
        env:
          VPS: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          cat > /tmp/lat11051-verify.sh <<'VEREOF'
          set -euo pipefail
          DIR=/opt/paperclip-cos/resourcespace-dam
          CFG_FILE="$DIR/config.php"
          CTR_DB=resourcespace-db
          CTR_APP=resourcespace
          APPUSER=$(grep -oP "(?<=mysql_username = .)[^']+" "$CFG_FILE")
          PW=$(grep -oP "(?<=mysql_password = .)[^']+" "$CFG_FILE")
          CRED=$(mktemp); chmod 600 "$CRED"
          printf '[client]\nuser=%s\npassword=%s\n' "$APPUSER" "$PW" > "$CRED"
          if docker exec -i "$CTR_DB" mariadb --defaults-extra-file=/dev/stdin -e "SELECT 1;" < "$CRED" >/dev/null 2>&1; then
            echo "DB_AUTH_OK — config.php-credential werkt tegen de live DB"
          else
            echo "::error::config.php-credential werkt NIET tegen de live DB"
            shred -u "$CRED" 2>/dev/null || rm -f "$CRED"
            exit 1
          fi
          shred -u "$CRED" 2>/dev/null || rm -f "$CRED"
          IP=$(docker inspect -f '{{range $k, $v := .NetworkSettings.Networks}}{{$v.IPAddress}} {{end}}' "$CTR_APP" | awk '{print $1}')
          CODE=$(curl -s -o /tmp/lat11051-verify-body.html -w '%{http_code}' --max-time 10 "http://$IP/" 2>/dev/null || echo 000)
          echo "GET / -> HTTP $CODE"
          grep -qiE 'access denied|cannot connect|database error' /tmp/lat11051-verify-body.html 2>/dev/null \
            && { echo "::error::DB-foutmelding in de body"; exit 1; }
          echo "wachtwoord-sha256: $(printf '%s' "$PW" | sha256sum | cut -c1-16)..."
          echo "VERIFY_OK"
          VEREOF
          ssh "$VPS" "bash -s" < /tmp/lat11051-verify.sh

      # ================================================================== rollback
      - name: Rollback (handmatig, laatste backup)
        if: inputs.mode == 'rollback'
        env:
          VPS: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          cat > /tmp/lat11051-rb.sh <<'RBEOF'
          set -uo pipefail
          DIR=/opt/paperclip-cos/resourcespace-dam
          ENV_FILE="$DIR/db.env"
          CFG_FILE="$DIR/config.php"
          CTR_DB=resourcespace-db
          ENV_BAK=$(ls -1t "$ENV_FILE".bak-lat11051-* 2>/dev/null | head -1)
          CFG_BAK=$(ls -1t "$CFG_FILE".bak-lat11051-* 2>/dev/null | head -1)
          [ -n "$ENV_BAK" ] && [ -n "$CFG_BAK" ] || { echo "::error::geen backuppaar van deze workflow gevonden"; exit 1; }

          # Nieuw root-wachtwoord staat nu live in de DB maar niet meer in db.env
          # (dat is net teruggezet); haal het uit de HUIDIGE (voor-rollback) config
          # is niet mogelijk voor root. Vraag daarom expliciet de operator om de
          # rollback via 'apply' se eigen automatische rollback te laten lopen als
          # die beschikbaar was; dit pad is voor de HANDMATIGE noodgreep en zet
          # alleen de BESTANDEN terug, niet de live DB-credential van root/app als
          # de laatste apply-run zelf al voorbij de ALTER USER-stap crashte zonder
          # zijn eigen rollback te halen (bijv. runner-timeout). Dat scenario is
          # zeldzaam: rollback_db in 'apply' draait al automatisch bij elke
          # bekende faalmodus hierboven.
          echo "::warning::dit pad zet alleen db.env/config.php terug op basis van de laatste backup."
          echo "::warning::als de live DB-credential niet meer overeenkomt met de teruggezette bestanden,"
          echo "::warning::gebruik dan het sha256-rapport van de laatste 'apply'-run om te bepalen welk"
          echo "::warning::wachtwoord nu live staat, en herstel de DB-kant handmatig voordat je verdergaat."

          INO_ENV_BEFORE=$(stat -c %i "$ENV_FILE")
          INO_CFG_BEFORE=$(stat -c %i "$CFG_FILE")
          cp "$ENV_BAK" "$ENV_FILE"
          cp "$CFG_BAK" "$CFG_FILE"
          INO_ENV_AFTER=$(stat -c %i "$ENV_FILE")
          INO_CFG_AFTER=$(stat -c %i "$CFG_FILE")
          [ "$INO_ENV_BEFORE" = "$INO_ENV_AFTER" ] || echo "::error::db.env inode gewijzigd bij rollback"
          [ "$INO_CFG_BEFORE" = "$INO_CFG_AFTER" ] || echo "::error::config.php inode gewijzigd bij rollback"
          echo "teruggezet uit $ENV_BAK / $CFG_BAK"
          echo "sha256 db.env: $(sha256sum "$ENV_FILE" | cut -c1-16)..."
          echo "sha256 config.php: $(sha256sum "$CFG_FILE" | cut -c1-16)..."
          RBEOF
          ssh "$VPS" "bash -s" < /tmp/lat11051-rb.sh
